<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habitus OS · Aderry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --purple:    #6B21A8;
  --purple-m:  #7F77DD;
  --purple-l:  rgba(107,33,168,0.08);
  --blue:      #3A0CA3;
  --bg:        #0D0910;
  --surface:   #130C18;
  --surface2:  #1C1228;
  --card:      rgba(107,33,168,0.06);
  --border:    rgba(107,33,168,0.15);
  --border-h:  rgba(107,33,168,0.32);
  --glass:     rgba(13,9,16,0.94);
  --t1:        #EDE8F5;
  --t2:        #B8A0D0;
  --t3:        #7A6888;
  --t4:        #3D2B52;
  --green:     #4CAF82;
  --green-bg:  rgba(76,175,130,0.10);
  --gold:      #C4933F;
  --gold-bg:   rgba(196,147,63,0.10);
  --gold-bd:   rgba(196,147,63,0.24);
  --shadow:    rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(107,33,168,0.3); border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: rgba(107,33,168,0.3) transparent; }

@keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse  { 0%,100%{opacity:.6} 50%{opacity:1} }
@keyframes toastin { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.fadein { animation: fadein 0.22s ease; }

/* ─── TOPBAR ─── */
#topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
  display: flex; align-items: center; gap: 0;
  padding: 0 20px;
  height: 48px;
}
.tb-logo {
  display: flex; align-items: center; gap: 8px;
  margin-right: 28px; flex-shrink: 0;
}
.tb-logo-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 11px; color: #fff; letter-spacing: 0.02em;
}
.tb-logo-text {
  font-family: 'Montserrat', sans-serif; font-weight: 600;
  font-size: 12px; color: var(--t2); letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tb-logo-sep {
  color: var(--t4); font-size: 11px; margin: 0 2px;
}
.tb-nav { display: flex; align-items: stretch; flex: 1; }
.tab-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 10px 16px;
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--t3);
  margin-bottom: -1px;
  transition: color 0.18s, border-color 0.18s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--t2); }
.tab-btn.active { border-bottom-color: var(--purple); color: var(--purple-m); }

.tb-right {
  display: flex; align-items: center; gap: 14px;
  margin-left: auto; flex-shrink: 0;
}
.week-dots { display: flex; gap: 4px; align-items: center; }
.wdot {
  width: 7px; height: 7px; border-radius: 2px;
  background: var(--t4); transition: background 0.2s;
  cursor: default;
}
.wdot.today { background: var(--purple-m); }
#clock {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--t3); letter-spacing: 0.06em;
}

/* ─── DAY PROGRESS ─── */
#dayprog {
  height: 2px; background: var(--border); position: relative; overflow: hidden;
}
#dayprogfill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple) 0%, var(--purple-m) 100%);
  transition: width 1s linear;
  width: 0%;
}

/* ─── MAIN ─── */
#main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

/* ─── PERIOD HEADER ─── */
.period-hdr {
  display: flex; align-items: center; gap: 10px;
  margin: 28px 0 10px;
}
.period-icon {
  font-size: 13px; line-height: 1;
  font-family: 'JetBrains Mono', monospace;
}
.period-label {
  font-family: 'Montserrat', sans-serif; font-weight: 600;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
}
.period-range {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--t3); margin-left: 2px;
}
.period-sub {
  font-size: 10px; color: var(--t3); margin-left: 4px;
  font-style: italic;
}
.period-line {
  flex: 1; height: 1px; background: var(--border);
}

/* ─── BLOCK ROWS ─── */
.blocks-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.block-row {
  display: grid;
  grid-template-columns: 22px 68px 86px 1fr 18px;
  align-items: center; gap: 10px;
  padding: 11px 14px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
}
.block-row:not(:last-child) { border-bottom: 1px solid var(--border); }
.block-row:hover { background: rgba(107,33,168,0.06) !important; }
.block-row.is-current { background: rgba(107,33,168,0.10); }
.block-row.is-open { /* border-left set inline */ }
.block-row.is-done { opacity: 0.68; }

.block-check {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border-h);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.15s;
  background: transparent;
}
.block-check.checked {
  background: var(--green-bg); border-color: var(--green); color: var(--green);
}

.block-time {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--t3); letter-spacing: 0.04em; text-align: right;
}
.dur-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; padding: 3px 8px; border-radius: 5px;
  text-align: center; white-space: nowrap;
  display: inline-block;
}
.block-label {
  font-size: 13px; font-weight: 500; color: var(--t1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.block-row.is-done .block-label { text-decoration: line-through; color: var(--t3); }
.block-chevron {
  font-size: 10px; color: var(--t3); text-align: right; transition: transform 0.2s;
  font-family: 'JetBrains Mono', monospace;
}
.block-row.is-open .block-chevron { transform: rotate(180deg); }

/* ─── BLOCK EXPAND ─── */
.block-expand {
  padding: 14px 16px 16px 51px;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  animation: fadein 0.18s ease;
}
.block-desc {
  font-size: 12px; color: var(--t3); line-height: 1.6;
  margin-bottom: 14px; font-style: italic;
}
.field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--t3); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 5px; display: block;
}
.field-input, .field-textarea {
  width: 100%; background: rgba(107,33,168,0.05);
  border: 1px solid var(--border); border-radius: 7px;
  color: var(--t1); font-family: 'Inter', sans-serif;
  font-size: 13px; padding: 8px 11px;
  outline: none; resize: vertical;
  transition: border-color 0.2s;
  margin-bottom: 10px;
}
.field-input:focus, .field-textarea:focus {
  border-color: var(--border-h);
  background: rgba(107,33,168,0.08);
}
.field-textarea { line-height: 1.6; min-height: 72px; }
.field-textarea.large { min-height: 110px; }
.field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields-sep { height: 1px; background: var(--border); margin: 10px 0 14px; }
.field-mini-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--t4); letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 8px; display: block;
}

/* ─── WEEK THEME BANNER ─── */
.week-banner {
  border-radius: 12px; padding: 16px 20px;
  margin-bottom: 20px;
  display: flex; align-items: flex-start; gap: 16px;
  border: 1px solid var(--border-h);
  position: relative;
}
.week-banner-tag {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 6px;
}
.week-banner-label {
  font-size: 11px; color: var(--t3); margin-bottom: 3px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em; text-transform: uppercase; font-size: 9px;
}
.week-banner-val { font-size: 12px; color: var(--t2); line-height: 1.5; }
.week-banner-cols { display: flex; gap: 28px; flex-wrap: wrap; flex: 1; }
.week-banner-col { min-width: 180px; }
.export-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--border-h); background: var(--purple-l);
  color: var(--purple-m); cursor: pointer; transition: all 0.18s;
  white-space: nowrap; flex-shrink: 0; align-self: flex-start;
}
.export-btn:hover { background: rgba(107,33,168,0.15); border-color: var(--purple-m); }

/* ─── DAY REVIEW ─── */
.review-card {
  background: var(--gold-bg); border: 1px solid var(--gold-bd);
  border-radius: 12px; padding: 20px; margin-top: 28px;
}
.review-title {
  font-family: 'Montserrat', sans-serif; font-weight: 600;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 18px;
}
.grat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
.score-row { display: flex; gap: 8px; margin-top: 4px; }
.score-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border-h); background: var(--card);
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  color: var(--t2); cursor: pointer; transition: all 0.15s;
}
.score-btn.active {
  background: var(--purple); border-color: var(--purple-m); color: #fff;
}
.score-btn:hover:not(.active) { border-color: var(--border-h); color: var(--t1); }

/* ─── SEMANA ─── */
.semana-intro {
  font-size: 13px; color: var(--t3); margin-bottom: 24px;
  line-height: 1.7; font-style: italic;
}
.week-grid { display: flex; flex-direction: column; gap: 10px; }
.wday-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  display: grid; grid-template-columns: 56px 1fr 1fr;
  gap: 16px; align-items: start;
  transition: border-color 0.18s, background 0.18s;
  cursor: default;
}
.wday-card.today {
  border-color: var(--border-h); background: var(--card);
}
.wday-name {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 16px; line-height: 1.1;
}
.wday-full { font-size: 10px; color: var(--t3); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.wday-badge {
  display: inline-block; padding: 3px 9px; border-radius: 5px;
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em; margin-bottom: 8px;
  font-weight: 500;
}
.wday-sub-label {
  font-size: 9px; font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--t3);
  margin-bottom: 4px;
}
.wday-sub-val { font-size: 12px; color: var(--t2); line-height: 1.55; }
.wday-today-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px;
  background: rgba(107,33,168,0.15); color: var(--purple-m);
  border: 1px solid var(--border-h);
  display: inline-block; margin-left: 8px; vertical-align: middle;
}

/* ─── ARQUIVO ─── */
.archive-list { display: flex; flex-direction: column; gap: 8px; }
.archive-entry {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.archive-entry:hover { background: var(--card); border-color: var(--border-h); }
.archive-date {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--t2); flex-shrink: 0;
}
.archive-day-tag {
  font-size: 11px; color: var(--t3); flex: 1;
}
.archive-score-dots { display: flex; gap: 3px; }
.archive-sdot {
  width: 8px; height: 8px; border-radius: 2px;
  background: var(--t4);
}
.archive-sdot.filled { background: var(--gold); }
.archive-count {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--t3);
}
.archive-back-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--border-h); background: var(--card);
  color: var(--t2); cursor: pointer; transition: all 0.18s;
  margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px;
}
.archive-back-btn:hover { background: var(--purple-l); color: var(--t1); }
.archive-empty {
  text-align: center; padding: 60px 20px;
  color: var(--t3); font-size: 13px; font-style: italic;
}

/* ─── PERFIL ─── */
.welcome-banner {
  background: var(--purple-l); border: 1px solid var(--border-h);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
}
.welcome-title {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 15px; color: var(--purple-m); margin-bottom: 6px;
}
.welcome-sub { font-size: 13px; color: var(--t2); line-height: 1.6; }
.profile-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 14px;
}
.profile-section-title {
  font-family: 'Montserrat', sans-serif; font-weight: 600;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--purple-m); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.profile-section-letter {
  width: 20px; height: 20px; border-radius: 5px;
  background: var(--purple-l); border: 1px solid var(--border-h);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--purple-m);
}
.save-profile-btn {
  background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
  color: #fff; border: none; border-radius: 9px;
  font-family: 'Montserrat', sans-serif; font-weight: 600;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 12px 28px; cursor: pointer; transition: opacity 0.18s;
  margin-top: 8px;
}
.save-profile-btn:hover { opacity: 0.85; }
.principles-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--border-h); background: var(--purple-l);
  color: var(--purple-m); cursor: pointer; transition: all 0.18s;
  display: inline-flex; align-items: center; gap: 6px;
}
.principles-toggle:hover { background: rgba(107,33,168,0.15); }
.principles-list { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.principle-item {
  border-left: 2px solid var(--purple);
  padding-left: 14px;
}
.principle-num {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--purple-m); letter-spacing: 0.08em; margin-bottom: 4px;
}
.principle-text { font-size: 13px; color: var(--t2); line-height: 1.6; font-style: italic; }
.principle-author { font-size: 11px; color: var(--t3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

/* ─── TOAST ─── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border-h);
  border-radius: 8px; padding: 9px 18px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--t1); z-index: 9999;
  display: none; letter-spacing: 0.04em;
  animation: toastin 0.22s ease;
  box-shadow: 0 4px 24px var(--shadow);
}
#toast.show { display: block; }

/* ─── MISC ─── */
.section-heading {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 18px; color: var(--t1); margin-bottom: 6px;
}
.section-sub { font-size: 12px; color: var(--t3); margin-bottom: 24px; }
.current-live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--purple-m);
  animation: pulse 2.6s ease-in-out infinite;
  display: inline-block; margin-right: 5px; vertical-align: middle;
}
.readonly-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px;
  background: rgba(107,33,168,0.12); color: var(--t3);
  border: 1px solid var(--border); display: inline-block; margin-left: 8px;
}
.day-key-label {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--t3); margin-bottom: 4px;
}
.day-key-date {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 17px; color: var(--t1); text-transform: capitalize;
  margin-bottom: 20px;
}

@media (max-width: 640px) {
  .week-banner-cols { flex-direction: column; gap: 12px; }
  .grat-row { grid-template-columns: 1fr; }
  .wday-card { grid-template-columns: 46px 1fr; }
  .wday-card > *:last-child { grid-column: 2; }
  .field-row2 { grid-template-columns: 1fr; }
  .week-dots { display: none; }
  .block-row { grid-template-columns: 22px 52px 68px 1fr 18px; gap: 6px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo">
      <div class="tb-logo-mark">Ad</div>
      <span class="tb-logo-text">Habitus</span>
      <span class="tb-logo-sep">·</span>
      <span class="tb-logo-text" style="color:var(--purple-m)">Aderry</span>
    </div>
    <nav class="tb-nav" id="tb-nav"></nav>
    <div class="tb-right">
      <div class="week-dots" id="week-dots"></div>
      <div id="clock"></div>
    </div>
  </div>
  <div id="dayprog"><div id="dayprogfill"></div></div>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════ */
const BLOCKS = [
  // MANHÃ
  {id:'m0',p:'manha',t:'06:00',e:'06:15',d:'15 min',label:'Acordar e ritual matinal',desc:'Água com sal, corpo, presença. Sem ecrãs. Chegada intencional ao dia.',fields:[]},
  {id:'m1',p:'manha',t:'06:15',e:'06:45',d:'30 min',label:'Devocional',desc:'Oração, meditação, silêncio. O Sábio começa pelo centro — não pela agenda.',fields:[{k:'recebeu',l:'O que recebi hoje?',big:true}]},
  {id:'m2',p:'manha',t:'06:45',e:'08:00',d:'75 min',label:'Leitura profunda',desc:'Livro de filosofia, estratégia ou método. Com lápis, sem pressa, com margem para pensar.',fields:[{k:'titulo',l:'Título do livro',big:false},{k:'autor',l:'Autor',big:false},{k:'pagina',l:'Páginas lidas',big:false},{k:'insight',l:'Insight principal',big:true}]},

const PROFILE_KEY = 'habitus-adelson-profile';
const JOURNAL_KEY = 'habitus-adelson-journal';

function todayKey() { return new Date().toISOString().slice(0,10); }
function loadProfile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch { return null; } }
function saveProfile(d) { localStorage.setItem(PROFILE_KEY, JSON.stringify(d)); }
function loadJournal() { try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)||'{}'); } catch { return {}; } }
function saveJournal(d) { localStorage.setItem(JOURNAL_KEY, JSON.stringify(d)); }

function getDay(k) {
  const j = loadJournal();
  if (j[k]) return j[k];
  const d = { blocks:{}, review:{learned:'',thinking:'',silence:'',gratitude:['','',''],score:0} };
  BLOCKS.forEach(b => { d.blocks[b.id] = {done:false,intention:'',notes:'',extras:{}}; });
  return d;
}
function saveDay(k, data) { const j=loadJournal(); j[k]=data; saveJournal(j); }
function updateBlockField(dateKey, blockId, field, value) {
  const d = getDay(dateKey);
  if (!d.blocks[blockId]) d.blocks[blockId] = {done:false,intention:'',notes:'',extras:{}};
  d.blocks[blockId][field] = value;
  saveDay(dateKey, d);
}
function updateBlockExtra(dateKey, blockId, extraKey, value) {
  const d = getDay(dateKey);
  if (!d.blocks[blockId]) d.blocks[blockId] = {done:false,intention:'',notes:'',extras:{}};
  if (!d.blocks[blockId].extras) d.blocks[blockId].extras = {};
  d.blocks[blockId].extras[extraKey] = value;
  saveDay(dateKey, d);
}
function updateReview(dateKey, field, value) {
  const d = getDay(dateKey);
  if (!d.review) d.review = {learned:'',thinking:'',silence:'',gratitude:['','',''],score:0};
  d.review[field] = value;
  saveDay(dateKey, d);
}
function updateGratitude(dateKey, idx, value) {
  const d = getDay(dateKey);
  if (!d.review) d.review = {learned:'',thinking:'',silence:'',gratitude:['','',''],score:0};
  if (!d.review.gratitude) d.review.gratitude = ['','',''];
  d.review.gratitude[idx] = value;
  saveDay(dateKey, d);
}

/* ════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════ */
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function hhmm(s) { const [h,m]=s.split(':').map(Number); return h*60+m; }
function fmtTime(d) { return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateLong(k) {
  const d = new Date(k+'T06:00:00');
  return d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function getCurrentBlockId() {
  const now = new Date();
  const m = now.getHours()*60+now.getMinutes();
  for (const b of BLOCKS) {
    if (b.id==='n5') continue;
    const s=hhmm(b.t), e=hhmm(b.e);
    if (m>=s && m<e) return b.id;
  }
  return null;
}
function getTodayWeek() {
  const d = new Date();
  const s = ALL_DAYS[d.getDay()];
  return WEEK.find(w=>w.day===s) || WEEK[0];
}
function checkSVG() {
  return '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
}
function showToast(msg, duration=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

/* ════════════════════════════════════════════════
   DAY PROGRESS
════════════════════════════════════════════════ */
function updateDayProgress() {
  const now = new Date();
  const m = now.getHours()*60+now.getMinutes();
  const dayStart = 6*60, dayEnd = 22*60+15;
  const pct = Math.max(0, Math.min(100, ((m - dayStart)/(dayEnd - dayStart))*100));
  const fill = document.getElementById('dayprogfill');
  if (fill) fill.style.width = pct + '%';
}

function renderTopbar() {
  const nav = document.getElementById('tb-nav');
  const tabs = [
    {id:'dia',    label:'Dia a Dia'},
    {id:'semana', label:'Semana'},
    {id:'arquivo',label:'Arquivo'},
    {id:'perfil', label:'Perfil'},
  ];
  nav.innerHTML = tabs.map(t =>
    `<button class="tab-btn${S.view===t.id?' active':''}" data-nav="${t.id}">${t.label}</button>`
  ).join('');

  // week dots
  const dotsEl = document.getElementById('week-dots');
  const todayIdx = new Date().getDay(); // 0=Sun
  dotsEl.innerHTML = ALL_DAYS.map((d,i) => {
    const isToday = i === todayIdx;
    const w = WEEK.find(x=>x.day===d);
    const color = w ? w.color : '#7F77DD';
    return `<div class="wdot${isToday?' today':''}" title="${d}" style="${isToday?'background:'+color+';box-shadow:0 0 6px '+color+'66':''}"></div>`;
  }).join('');

  // clock
  const clockEl = document.getElementById('clock');
  if (clockEl) clockEl.textContent = fmtTime(new Date());
}

function updateTabActive() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.nav === S.view);
  });
}

   RENDER MAIN
════════════════════════════════════════════════ */
function renderMain() {
  const main = document.getElementById('main');
  if (S.view === 'dia') {
    main.innerHTML = renderDia(false, todayKey());
  } else if (S.view === 'semana') {
    main.innerHTML = renderSemana();
  } else if (S.view === 'arquivo') {
    main.innerHTML = renderArquivo();
  } else if (S.view === 'perfil') {
    main.innerHTML = renderPerfil();
  }
  main.classList.remove('fadein');
  void main.offsetWidth;
  main.classList.add('fadein');
  updateTabActive();
}

/* ════════════════════════════════════════════════
   renderDia
════════════════════════════════════════════════ */
function renderDia(readonly, dayKey) {
  const ddata = getDay(dayKey);
  const currentId = readonly ? null : getCurrentBlockId();
  const tw = getTodayWeek();
  const isToday = dayKey === todayKey();

  // Week banner
  let html = '';
  html += `<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:20px">`;
  if (!readonly && isToday) {
    html += `<div>
      <div class="day-key-label">Hoje</div>
      <div class="day-key-date">${fmtDateLong(dayKey)}</div>
    </div>`;
  } else {
    html += `<div>
      <div class="day-key-label">${readonly ? '<span class="readonly-badge">arquivo</span>' : ''}</div>
      <div class="day-key-date">${fmtDateLong(dayKey)}</div>
    </div>`;
  }
  html += `</div>`;

  // Week theme banner
  html += `<div class="week-banner" style="background:linear-gradient(135deg,${tw.color}14 0%,${tw.color}08 100%);border-color:${tw.color}40">
    <div style="flex:1">
      <div class="week-banner-tag" style="color:${tw.color}">${esc(tw.tag)}</div>
      <div class="week-banner-cols">
        <div class="week-banner-col">
          <div class="week-banner-label">Estudo do dia</div>
          <div class="week-banner-val">${esc(tw.study)}</div>
        </div>
        <div class="week-banner-col">
          <div class="week-banner-label">Conteúdo / Foco</div>
          <div class="week-banner-val">${esc(tw.content)}</div>
        </div>
      </div>
    </div>
    ${!readonly ? `<button class="export-btn" data-export>Exportar</button>` : ''}
  </div>`;

  // Periods
  PERIODS.forEach(period => {
    const blocks = BLOCKS.filter(b => b.p === period.id);
    html += `<div class="period-hdr">
      <span class="period-icon" style="color:${period.color}">${period.icon}</span>
      <span class="period-label" style="color:${period.color}">${period.label}</span>
      <span class="period-range">${period.range}</span>
      <span class="period-sub">· ${period.sub}</span>
      <div class="period-line"></div>
    </div>`;
    html += `<div class="blocks-card">`;
    blocks.forEach((block, bi) => {
      const bd = ddata.blocks[block.id] || {done:false,intention:'',notes:'',extras:{}};
      const isCurrent = !readonly && currentId === block.id;
      const isOpen = S.expandedBlock === block.id;
      const isDone = bd.done;
      let rowClass = 'block-row';
      if (isCurrent) rowClass += ' is-current';
      if (isOpen) rowClass += ' is-open';
      if (isDone) rowClass += ' is-done';
      const borderColor = (isCurrent || isOpen) ? period.color : 'transparent';

      html += `<div class="${rowClass}" style="--period-color:${period.color};border-left-color:${borderColor}" data-toggle-block="${block.id}">`;
      // Checkbox
      if (!readonly) {
        html += `<div class="block-check${isDone?' checked':''}" data-toggle-done="${block.id}" title="Marcar como feito">
          ${isDone ? checkSVG() : ''}
        </div>`;
      } else {
        html += `<div class="block-check${isDone?' checked':''}" style="cursor:default">
          ${isDone ? checkSVG() : ''}
        </div>`;
      }
      // Time
      html += `<div class="block-time">${block.t}</div>`;
      // Dur badge
      html += `<div class="dur-badge" style="background:${period.color}20;color:${period.color}">${block.d}</div>`;
      // Label
      if (isCurrent) {
        html += `<div class="block-label"><span class="current-live"></span>${esc(block.label)}</div>`;
      } else {
        html += `<div class="block-label">${esc(block.label)}</div>`;
      }
      // Chevron
      html += `<div class="block-chevron">${isOpen ? '▲' : '▼'}</div>`;
      html += `</div>`; // .block-row

      // Expanded content
      if (isOpen) {
        html += `<div class="block-expand" style="border-left-color:${period.color}">`;
        html += `<div class="block-desc">${esc(block.desc)}</div>`;

        // Custom fields
        if (block.fields && block.fields.length > 0) {
          const smallFields = block.fields.filter(f => !f.big);
          const bigFields = block.fields.filter(f => f.big);

          if (smallFields.length > 0) {
            if (smallFields.length >= 2) {
              html += `<div class="field-row2">`;
              smallFields.forEach(f => {
                const val = bd.extras ? (bd.extras[f.k] || '') : '';
                html += `<div><label class="field-label">${esc(f.l)}</label>
                  <input class="field-input" type="text" placeholder="${esc(f.l)}" value="${esc(val)}"
                    data-extra="${f.k}" data-bid="${block.id}" data-dkey="${dayKey}" ${readonly?'disabled':''}></div>`;
              });
              html += `</div>`;
            } else {
              smallFields.forEach(f => {
                const val = bd.extras ? (bd.extras[f.k] || '') : '';
                html += `<label class="field-label">${esc(f.l)}</label>
                  <input class="field-input" type="text" placeholder="${esc(f.l)}" value="${esc(val)}"
                    data-extra="${f.k}" data-bid="${block.id}" data-dkey="${dayKey}" ${readonly?'disabled':''}><br>`;
              });
            }
          }
          bigFields.forEach(f => {
            const val = bd.extras ? (bd.extras[f.k] || '') : '';
            html += `<label class="field-label">${esc(f.l)}</label>
              <textarea class="field-textarea${f.large?' large':''}" placeholder="${esc(f.l)}"
                data-extra="${f.k}" data-bid="${block.id}" data-dkey="${dayKey}" ${readonly?'disabled':''}>${esc(val)}</textarea>`;
          });
          html += `<div class="fields-sep"></div>`;
        }

        // Intention
        html += `<label class="field-mini-label">Intenção para este bloco</label>
          <input class="field-input" type="text" placeholder="O que quero realizar neste bloco..."
            value="${esc(bd.intention||'')}" data-field="intention" data-bid="${block.id}" data-dkey="${dayKey}" ${readonly?'disabled':''}><br>`;
        // Notes
        html += `<label class="field-mini-label">Notas / Reflexão</label>
          <textarea class="field-textarea" placeholder="Notas livres sobre este bloco..."
            data-field="notes" data-bid="${block.id}" data-dkey="${dayKey}" ${readonly?'disabled':''}>${esc(bd.notes||'')}</textarea>`;

        html += `</div>`; // .block-expand
      }
    });
    html += `</div>`; // .blocks-card
  });

  // Day Review
  const rev = ddata.review || {learned:'',thinking:'',silence:'',gratitude:['','',''],score:0};
  html += `<div class="review-card">
    <div class="review-title">◈ Revisão do Dia</div>
    <label class="field-label" style="color:var(--gold)">O que aprendi hoje?</label>
    <textarea class="field-textarea" placeholder="Insights, aprendizados, surpresas do dia..."
      data-review="learned" data-dkey="${dayKey}" ${readonly?'disabled':''}>${esc(rev.learned||'')}</textarea>
    <label class="field-label" style="color:var(--gold)">O que ocupou o meu pensamento?</label>
    <textarea class="field-textarea" placeholder="Ideias, questões abertas, reflexões..."
      data-review="thinking" data-dkey="${dayKey}" ${readonly?'disabled':''}>${esc(rev.thinking||'')}</textarea>
    <label class="field-label" style="color:var(--gold)">Que silêncio foi produtivo hoje?</label>
    <textarea class="field-textarea" placeholder="Momentos de quietude que criaram algo..."
      data-review="silence" data-dkey="${dayKey}" ${readonly?'disabled':''}>${esc(rev.silence||'')}</textarea>
    <label class="field-label" style="color:var(--gold);margin-top:4px">Gratidão (3 itens)</label>
    <div class="grat-row">
      ${[0,1,2].map(i => `<input class="field-input" type="text" placeholder="Gratidão ${i+1}..."
        value="${esc((rev.gratitude&&rev.gratitude[i])||'')}" data-grat="${i}" data-dkey="${dayKey}" ${readonly?'disabled':''}>`).join('')}
    </div>
    <label class="field-label" style="color:var(--gold)">Score do dia</label>
    <div class="score-row">
      ${[1,2,3,4,5].map(n => `<button class="score-btn${(rev.score||0)===n?' active':''}"
        data-score="${n}" data-dkey="${dayKey}" ${readonly?'disabled':''}>${n}</button>`).join('')}
    </div>
  </div>`;

  return html;
}

      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ════════════════════════════════════════════════
   renderArquivo
════════════════════════════════════════════════ */
function renderArquivo() {
  if (S.archiveKey) {
    const ddata = getDay(S.archiveKey);
    const rev = ddata.review || {};
    let html = `<button class="archive-back-btn" data-archive-back>← Voltar ao arquivo</button>`;
    html += renderDia(true, S.archiveKey);
    return html;
  }

  const journal = loadJournal();
  const keys = Object.keys(journal).sort().reverse();
  const today = todayKey();

  let html = `<div class="section-heading">Arquivo</div>
  <div class="section-sub">Todos os dias registados no sistema Habitus OS · Aderry.</div>`;

  if (keys.length === 0) {
    html += `<div class="archive-empty">Nenhum dia arquivado ainda.<br>Começa por registar o teu dia na aba "Dia a Dia".</div>`;
    return html;
  }

  html += `<div class="archive-list">`;
  keys.forEach(k => {
    if (k === today) return; // today shown in dia tab
    const d = journal[k];
    const rev = d.review || {};
    const score = rev.score || 0;
    const blocks = d.blocks || {};
    const doneCount = Object.values(blocks).filter(b => b.done).length;
    const totalBlocks = BLOCKS.length;
    const dateStr = fmtDateLong(k);

    const dayIdx = new Date(k+'T06:00:00').getDay();
    const dayShort = ALL_DAYS[dayIdx];
    const weekDay = WEEK.find(w => w.day === dayShort);
    const dayTag = weekDay ? weekDay.tag : '';
    const dayColor = weekDay ? weekDay.color : '#7F77DD';

    html += `<div class="archive-entry" data-archive-open="${k}">
      <div class="archive-date">${k}</div>
      <div>
        <div style="font-size:12px;color:var(--t1);margin-bottom:3px">${dateStr}</div>
        <div class="archive-day-tag" style="color:${dayColor}">${esc(dayTag)}</div>
      </div>
      <div style="flex:1"></div>
      <div class="archive-count">${doneCount}/${totalBlocks}</div>
      <div class="archive-score-dots">
        ${[1,2,3,4,5].map(n => `<div class="archive-sdot${n<=score?' filled':''}"></div>`).join('')}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ════════════════════════════════════════════════
   renderPerfil
════════════════════════════════════════════════ */

    ta('mercado',    'A quem serves?',    p.mercado,  'Público-alvo, clientes ideais, contexto...')

  html += sec('C', 'Visão e Posicionamento',

    inp('posicao',   'Como te defines profissionalmente', p.posicao, 'Ex: Estratega, Mentor, Fundador...')

  html += sec('D', 'Filosofia Pessoal',
    ta('filosofia',  'A tua filosofia de vida e trabalho', p.filosofia, 'O que guia as tuas decisões?') +
    inp('inspiracao','Figura ou referência que te inspira',  p.inspiracao,'Ex: Marco Aurélio, Schopenhauer...')

    ta('ritual',     'Ritual matinal actual',              p.ritual,   'Como começas o dia hoje?')

  html += sec('F', 'Intenção Actual',
    ta('intencao',   'O que precisas de construir nos próximos 90 dias?', p.intencao, 'Foco, objectivo, projecto...') +
    ta('obstaculos', 'Que obstáculos prevês?',                            p.obstaculos,'O que pode sair do caminho?')

  html += `<div class="profile-section">

/* ════════════════════════════════════════════════
   EXPORT
════════════════════════════════════════════════ */
function exportDay(dayKey) {
  const ddata = getDay(dayKey);
  const rev = ddata.review || {};
  let lines = [];
  lines.push(`HABITUS OS · ADERRY — ${fmtDateLong(dayKey)}`);
  lines.push('═'.repeat(50));
  lines.push('');

  PERIODS.forEach(period => {
    lines.push(`${period.icon} ${period.label.toUpperCase()} (${period.range})`);
    lines.push('─'.repeat(40));
    BLOCKS.filter(b => b.p === period.id).forEach(b => {
      const bd = ddata.blocks[b.id] || {};
      const done = bd.done ? '[✓]' : '[ ]';
      lines.push(`${done} ${b.t}  ${b.label}  (${b.d})`);
      if (bd.intention) lines.push(`    Intenção: ${bd.intention}`);
      if (bd.notes) lines.push(`    Notas: ${bd.notes}`);
      if (bd.extras) {
        Object.entries(bd.extras).forEach(([k,v]) => {
          if (v) lines.push(`    ${k}: ${v}`);
        });
      }
    });
    lines.push('');
  });

  lines.push('◈ REVISÃO DO DIA');
  lines.push('─'.repeat(40));
  if (rev.learned) lines.push(`Aprendi: ${rev.learned}`);
  if (rev.thinking) lines.push(`Pensamentos: ${rev.thinking}`);
  if (rev.silence) lines.push(`Silêncio produtivo: ${rev.silence}`);
  if (rev.gratitude) lines.push(`Gratidão: ${rev.gratitude.filter(Boolean).join(' · ')}`);
  if (rev.score) lines.push(`Score: ${rev.score}/5`);

  return lines.join('\n');
}

/* ════════════════════════════════════════════════
   EVENT HANDLERS
════════════════════════════════════════════════ */
function handleClick(e) {
  const t = e.target;

  // Nav tabs
  const navBtn = t.closest('[data-nav]');
  if (navBtn) {
    S.view = navBtn.dataset.nav;
    S.expandedBlock = null;
    S.archiveKey = null;
    renderMain();
    return;
  }

  // Toggle block expand
  const toggleBlock = t.closest('[data-toggle-block]');
  if (toggleBlock && !t.closest('[data-toggle-done]') && !t.closest('input') && !t.closest('textarea') && !t.closest('button[data-score]') && !t.closest('[data-export]')) {
    const bid = toggleBlock.dataset.toggleBlock;
    S.expandedBlock = S.expandedBlock === bid ? null : bid;
    renderMain();
    return;
  }

  // Toggle done
  const toggleDone = t.closest('[data-toggle-done]');
  if (toggleDone) {
    e.stopPropagation();
    const bid = toggleDone.dataset.toggleDone;
    const dk = todayKey();
    const d = getDay(dk);
    if (!d.blocks[bid]) d.blocks[bid] = {done:false,intention:'',notes:'',extras:{}};
    d.blocks[bid].done = !d.blocks[bid].done;
    saveDay(dk, d);
    // Update just the checkbox without full re-render
    const checkEl = toggleDone;
    const isDone = d.blocks[bid].done;
    checkEl.classList.toggle('checked', isDone);
    checkEl.innerHTML = isDone ? checkSVG() : '';
    const row = checkEl.closest('.block-row');
    if (row) {
      row.classList.toggle('is-done', isDone);
      const label = row.querySelector('.block-label');
      if (label) label.style.textDecoration = isDone ? 'line-through' : '';
    }
    return;
  }

  // Score button
  const scoreBtn = t.closest('[data-score]');
  if (scoreBtn && !scoreBtn.disabled) {
    const score = parseInt(scoreBtn.dataset.score);
    const dk = scoreBtn.dataset.dkey || todayKey();
    updateReview(dk, 'score', score);
    // Update all score buttons
    const scoreRow = scoreBtn.closest('.score-row');
    if (scoreRow) {
      scoreRow.querySelectorAll('.score-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.score) === score);
      });
    }
    return;
  }

  // Export
  const exportBtn = t.closest('[data-export]');
  if (exportBtn) {
    const dk = todayKey();
    const text = exportDay(dk);
    navigator.clipboard.writeText(text).then(() => {
      exportBtn.textContent = '✓ Copiado!';
      setTimeout(() => { exportBtn.textContent = 'Exportar'; }, 2000);
    }).catch(() => {
      showToast('Não foi possível copiar — tenta manualmente.');
    });
    return;
  }

  // Archive open
  const archiveOpen = t.closest('[data-archive-open]');
  if (archiveOpen) {
    S.archiveKey = archiveOpen.dataset.archiveOpen;
    S.expandedBlock = null;
    renderMain();
    return;
  }

  // Archive back
  if (t.closest('[data-archive-back]')) {
    S.archiveKey = null;
    S.expandedBlock = null;
    renderMain();
    return;
  }

  // Toggle principles
  if (t.closest('[data-toggle-principles]')) {
    S.showPrinciples = !S.showPrinciples;
    renderMain();
    return;
  }

  // Save profile
  if (t.closest('[data-save-profile]')) {
    const fields = ['nome','cidade','empresa','negocio','mercado','visao','posicao','filosofia','inspiracao','pico','desafio','ritual','intencao','obstaculos'];
    const profile = {};
    fields.forEach(f => {
      const el = document.getElementById('pf-'+f);
      if (el) profile[f] = el.value;
    });
    saveProfile(profile);
    S.isFirstVisit = false;
    showToast('Perfil guardado');
    setTimeout(() => {
      S.view = 'dia';
      renderMain();
    }, 800);
    return;
  }
}

function handleInput(e) {
  const t = e.target;

  // Block field (intention / notes)
  if (t.dataset.field && t.dataset.bid) {
    const dk = t.dataset.dkey || todayKey();
    updateBlockField(dk, t.dataset.bid, t.dataset.field, t.value);
    return;
  }

  // Block extra field
  if (t.dataset.extra && t.dataset.bid) {
    const dk = t.dataset.dkey || todayKey();
    updateBlockExtra(dk, t.dataset.bid, t.dataset.extra, t.value);
    return;
  }

  // Review fields
  if (t.dataset.review) {
    const dk = t.dataset.dkey || todayKey();
    updateReview(dk, t.dataset.review, t.value);
    return;
  }

  // Gratitude
  if (t.dataset.grat !== undefined) {
    const dk = t.dataset.dkey || todayKey();
    updateGratitude(dk, parseInt(t.dataset.grat), t.value);
    return;
  }
}

/* ════════════════════════════════════════════════
   CLOCK TICK
════════════════════════════════════════════════ */
function startClock() {
  updateDayProgress();
  const tick = () => {
    const clockEl = document.getElementById('clock');
    if (clockEl) clockEl.textContent = fmtTime(new Date());
    updateDayProgress();
    // Update current block highlight if on dia view
    if (S.view === 'dia') {
      const currentId = getCurrentBlockId();
      document.querySelectorAll('.block-row').forEach(row => {
        const bid = row.dataset.toggleBlock;
        if (!bid) return;
        const wasCurrent = row.classList.contains('is-current');
        const isCurrent = bid === currentId;
        if (wasCurrent !== isCurrent) {
          row.classList.toggle('is-current', isCurrent);
          const period = PERIODS.find(p => BLOCKS.find(b => b.id === bid && b.p === p.id));
          if (isCurrent && period) {
            row.style.borderLeftColor = period.color;
          } else if (!row.classList.contains('is-open')) {
            row.style.borderLeftColor = 'transparent';
          }
        }
      });
    }
  };
  setInterval(tick, 60000);
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
function init() {
  renderTopbar();
  const profile = loadProfile();
  if (!profile || !profile.nome) {
    S.view = 'perfil';
    S.isFirstVisit = true;
  }
  renderMain();
  startClock();
  document.addEventListener('click', handleClick);
  document.addEventListener('input', handleInput);
}

document.addEventListener('DOMContentLoaded', init);
</script>
