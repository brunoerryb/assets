const STORE_KEY = "habitus-adelson-v2";
const loadAll  = ()    => { try { return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); } catch { return {}; } };
const saveAll  = (d)   => { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} };

const fmtTime  = (d)   => d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
const hhmm     = (s)   => { const [h,m]=s.split(":").map(Number); return h*60+m; };

function emptyDay() {
  const blocks = {};
  BLOCKS.forEach(b => { blocks[b.id] = { done:false, intention:"", notes:"", extras:{} }; });
  return { blocks, review:{ learned:"", thinking:"", silence:"", gratitude:["","",""], score:0 } };
}
function getDay(all, k) { return all[k] || emptyDay(); }
function uid() { return Math.random().toString(36).slice(2,9); }

/* ─────────────────────────────────────────
   EXPORT
───────────────────────────────────────── */
function buildExport(dayData, dateStr, dayShort) {
  const ws = WEEK.find(w=>w.day===dayShort) || WEEK[0];
  let t = `HABITUS OS · ADELSON · ADERRY\n${dateStr}\n${ws.tag}\n${"─".repeat(46)}\n\n`;
  BLOCKS.forEach(b => {
    const bd = dayData.blocks[b.id] || {};
    t += `${bd.done?"[✓]":"[ ]"} ${b.time}  ${b.label} (${b.dur})\n`;
    if (bd.intention) t += `    Intenção: ${bd.intention}\n`;
    (b.fields||[]).forEach(f => { const v=(bd.extras||{})[f.k]; if(v) t+=`    ${f.l}: ${v}\n`; });
    if (bd.notes) t += `    Notas: ${bd.notes}\n`;
    t += "\n";
  });
  const r = dayData.review||{};
  t += `${"─".repeat(46)}\nREVISÃO\n\n`;
  if (r.learned)  t += `O que aprendi: ${r.learned}\n\n`;
  if (r.thinking) t += `Pensamento avançou: ${r.thinking}\n\n`;
  if (r.silence)  t += `O silêncio mostrou: ${r.silence}\n\n`;
  if (r.gratitude?.some(g=>g)) t += `Gratidão: ${r.gratitude.filter(Boolean).join(" · ")}\n\n`;
  if (r.score)    t += `Nota: ${r.score}/5\n`;
  return t;
}

function downloadTxt(content, filename) {
  const a = document.createElement("a");
  a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(content);
  a.download = filename; a.click();
}

function Tag({ label, color, bg, border }) {
  return (
    <span style={{
      fontFamily:"'JetBrains Mono',monospace", fontSize:"8px",
      letterSpacing:"0.14em", textTransform:"uppercase", fontWeight:600,
      color:color||C.pSoft, background:bg||C.p10,
      border:`1px solid ${border||C.borderA}`,
      padding:"2px 8px", borderRadius:"4px",
    }}>{label}</span>
  );
}

function SectionHead({ icon, label, color, right }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"10px" }}>
      <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", textTransform:"uppercase", color, fontWeight:600 }}>
        {icon} {label}

      <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg, ${color}35, transparent)` }}/>
      {right && <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4 }}>{right}</div>}
    </div>
  );
}

    const s=hhmm(b.time), e=hhmm(b.end);
    return nowMin>=s && nowMin<e;
  };

    <div className="fadein">

function TemplateView({ now, todayWS, allData, setAllData }) {
  const [vDate, setVDate] = useState(new Date(now));
  const vKey   = dateKey(vDate);
  const vShort = ALL_DAYS[vDate.getDay()];
  const vWS    = WEEK.find(w=>w.day===vShort) || WEEK[0];
  const isToday= vKey===dateKey(now);

  const dayData = useMemo(()=>getDay(allData,vKey),[allData,vKey]);

  const upd = useCallback(fn => {
    setAllData(a=>{const n={...a,[vKey]:fn(getDay(a,vKey))};saveAll(n);return n;});
  },[vKey]);

  const setBF   = (id,f,v) => upd(d=>({...d,blocks:{...d.blocks,[id]:{...d.blocks[id],[f]:v}}}));
  const setExtr = (id,k,v) => upd(d=>({...d,blocks:{...d.blocks,[id]:{...d.blocks[id],extras:{...(d.blocks[id]?.extras||{}),[k]:v}}}}));
  const setRev  = (f,v)    => upd(d=>({...d,review:{...(d.review||{}),[f]:v}}));
  const setGrat = (i,v)    => upd(d=>{const g=[...((d.review||{}).gratitude||["","",""])];g[i]=v;return{...d,review:{...(d.review||{}),gratitude:g}};});

  const shiftDay= n=>setVDate(d=>{const nd=new Date(d);nd.setDate(nd.getDate()+n);return nd;});
  const rev     = dayData.review||{};
  const doneCnt = BLOCKS.filter(b=>(dayData.blocks[b.id]||{}).done).length;

  const doExport = ()=>{
    const txt = buildExport(dayData, vDate.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}), vShort);
    downloadTxt(txt, `habitus-adelson-${vKey}.txt`);
  };

  return (
    <div className="fadein">
      {/* Date nav */}
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",background:C.surface,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"11px 17px",marginBottom:"16px",boxShadow:`0 2px 12px ${C.shadow}` }}>
        <button className="ibtn" onClick={()=>shiftDay(-1)} style={{ width:"32px",height:"32px",borderRadius:"8px",background:C.card,border:`1px solid ${C.border}`,color:C.t3,display:"flex",alignItems:"center",justifyContent:"center" }}><PrevIco/></button>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif",fontSize:"14px",fontWeight:700,color:C.t1 }}>
            {vDate.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4,marginTop:"2px" }}>
            {isToday&&<span style={{ color:C.green }}>HOJE · </span>}
            <span style={{ color:vWS.color }}>{vWS.tag}</span>
            {" · "}{doneCnt}/{BLOCKS.length} blocos
          </div>
        </div>
        <div style={{ display:"flex",gap:"7px" }}>
          <button className="ibtn" onClick={()=>shiftDay(1)} style={{ width:"32px",height:"32px",borderRadius:"8px",background:C.card,border:`1px solid ${C.border}`,color:C.t3,display:"flex",alignItems:"center",justifyContent:"center" }}><NextIco/></button>
          <button className="ibtn" onClick={doExport} title="Exportar" style={{ width:"32px",height:"32px",borderRadius:"8px",background:C.card,border:`1px solid ${C.border}`,color:C.pSoft,display:"flex",alignItems:"center",justifyContent:"center" }}><DownIco/></button>
        </div>
      </div>

      {/* Progress */}
      <div style={{ height:"3px",background:C.border,borderRadius:"2px",marginBottom:"20px" }}>
        <div style={{ height:"100%",width:`${(doneCnt/BLOCKS.length)*100}%`,background:`linear-gradient(90deg,${C.primary},${C.green})`,borderRadius:"2px",transition:"width 0.3s" }}/>
      </div>

      {PERIODS.map(pr => {
        const pB = BLOCKS.filter(b=>b.p===pr.id);
        return (
          <div key={pr.id} style={{ marginBottom:"26px" }}>
            <SectionHead icon={pr.icon} label={pr.label} color={pr.color} />
            <div style={{ display:"flex",flexDirection:"column",gap:"7px" }}>
              {pB.map(b => (
                <BlockCard key={b.id} b={b} data={dayData.blocks[b.id]||{}} pc={pr.color}
                  onDone  ={v=>setBF(b.id,"done",v)}
                  onIntent={v=>setBF(b.id,"intention",v)}
                  onNotes ={v=>setBF(b.id,"notes",v)}
                  onExtr  ={(k,v)=>setExtr(b.id,k,v)}
                />
              ))}
            </div>
          </div>
        );
      })}

      {/* Revisão */}
      <div style={{ background:C.goldBg,border:`1px solid ${C.goldBd}`,borderRadius:"13px",padding:"22px 24px" }}>
        <div style={{ fontFamily:"'Syne',sans-serif",fontSize:"14px",fontWeight:700,color:C.goldS,marginBottom:"18px" }}>
          Revisão do Dia
        </div>
        {[
          { f:"learned",  l:"O que aprendi hoje que não sabia ontem?" },
          { f:"thinking", l:"O meu pensamento avançou? Em que direcção?" },
          { f:"silence",  l:"O que o silêncio de hoje me mostrou?" },
        ].map(({f,l})=>(
          <div key={f} style={{ marginBottom:"12px" }}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"5px" }}>{l}</div>
            <textarea rows={2} value={(rev[f])||""} onChange={e=>setRev(f,e.target.value)}
              onFocus={e=>e.target.style.borderColor=C.gold} onBlur={e=>e.target.style.borderColor=C.border}
              style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"9px 12px",fontSize:"12px",color:C.t2,lineHeight:1.65,fontFamily:"'JetBrains Mono',monospace" }}
            />
          </div>
        ))}
        <div style={{ marginBottom:"14px" }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"8px" }}>Gratidão (3 coisas)</div>
          <div style={{ display:"flex",flexDirection:"column",gap:"5px" }}>
            {[0,1,2].map(i=>(
              <input key={i} type="text" value={(rev.gratitude||["","",""])[i]||""} onChange={e=>setGrat(i,e.target.value)}
                placeholder={`${i+1}.`}
                onFocus={e=>e.target.style.borderColor=C.gold} onBlur={e=>e.target.style.borderColor=C.border}
                style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"8px 12px",fontSize:"12px",color:C.t2,fontFamily:"'JetBrains Mono',monospace" }}
              />
            ))}
          </div>
        </div>
        <div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"8px" }}>Nota do dia</div>
          <div style={{ display:"flex",gap:"7px" }}>
            {[1,2,3,4,5].map(n=>(
              <button key={n} className="ibtn" onClick={()=>setRev("score",rev.score===n?0:n)} style={{
                width:"40px",height:"40px",borderRadius:"10px",
                background:rev.score>=n?`${C.gold}22`:C.card,
                border:`1px solid ${rev.score>=n?C.gold:C.border}`,
                color:rev.score>=n?C.gold:C.t4,
                fontFamily:"'Syne',sans-serif",fontSize:"16px",fontWeight:700,
              }}>{n}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function BlockCard({ b, data:bd, pc, onDone, onIntent, onNotes, onExtr }) {
  const [open, setOpen] = useState(false);
  const done = bd.done||false;
  return (
    <div style={{
      background:done?C.greenBg:C.card,
      border:`1px solid ${done?C.green+"28":(open?`${pc}28`:C.border)}`,
      borderRadius:"12px",overflow:"hidden",
      boxShadow:`0 1px 8px ${C.shadow}`,
    }}>
      {/* Header */}
      <div onClick={()=>setOpen(!open)} style={{ display:"grid",gridTemplateColumns:"auto 68px 86px 1fr auto",alignItems:"center",gap:"12px",padding:"12px 16px",cursor:"pointer" }}>
        <button className="ibtn" onClick={e=>{e.stopPropagation();onDone(!done)}} style={{
          width:"22px",height:"22px",borderRadius:"6px",background:done?C.green:"transparent",
          border:`2px solid ${done?C.green:C.t4}`,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",flexShrink:0,
        }}>{done&&<CheckIco/>}</button>
        <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:done?C.t3:pc }}>{b.time}</div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:pc,background:`${pc}18`,borderRadius:"5px",padding:"3px 8px",textAlign:"center",whiteSpace:"nowrap" }}>{b.dur}</div>
        <div style={{ fontFamily:"'Syne',sans-serif",fontSize:"13px",color:done?C.t3:(open?C.t1:C.t2),fontWeight:open?600:400,textDecoration:done?"line-through":"none",lineHeight:1.3 }}>{b.label}</div>
        <div style={{ color:open?pc:C.t4,fontSize:"15px",transition:"transform 0.2s",transform:open?"rotate(90deg)":"none",userSelect:"none" }}>›</div>
      </div>

      {/* Expanded */}
      {open && (
        <div className="fadein" style={{ borderTop:`1px solid ${C.border}`,padding:"15px 17px" }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"10px",color:C.t3,lineHeight:1.65,marginBottom:"14px" }}>{b.desc}</div>

          {/* Special fields */}
          {(b.fields||[]).map(f=>(
            <div key={f.k} style={{ marginBottom:"10px" }}>
              <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"8px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"4px" }}>{f.l}</div>
              {f.big
                ? <textarea rows={3} value={(bd.extras||{})[f.k]||""} onChange={e=>onExtr(f.k,e.target.value)}
                    onFocus={e=>e.target.style.borderColor=pc} onBlur={e=>e.target.style.borderColor=C.border}
                    style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"9px 12px",fontSize:"12px",color:C.t2,lineHeight:1.65,fontFamily:"'JetBrains Mono',monospace" }}/>
                : <input type="text" value={(bd.extras||{})[f.k]||""} onChange={e=>onExtr(f.k,e.target.value)}
                    onFocus={e=>e.target.style.borderColor=pc} onBlur={e=>e.target.style.borderColor=C.border}
                    style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"8px 12px",fontSize:"12px",color:C.t2,fontFamily:"'JetBrains Mono',monospace" }}/>
              }
            </div>
          ))}

          {/* Common fields */}
          <div style={{ marginBottom:"10px" }}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"8px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"4px" }}>Intenção do bloco</div>
            <input type="text" value={bd.intention||""} onChange={e=>onIntent(e.target.value)} placeholder="O que quero que este tempo produza?"
              onFocus={e=>e.target.style.borderColor=pc} onBlur={e=>e.target.style.borderColor=C.border}
              style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"8px 12px",fontSize:"12px",color:C.t2,fontFamily:"'JetBrains Mono',monospace" }}/>
          </div>
          <div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"8px",color:C.t4,letterSpacing:"0.13em",textTransform:"uppercase",marginBottom:"4px" }}>Notas livres</div>
            <textarea rows={2} value={bd.notes||""} onChange={e=>onNotes(e.target.value)} placeholder="Pensamentos, observações, o que surgiu..."
              onFocus={e=>e.target.style.borderColor=pc} onBlur={e=>e.target.style.borderColor=C.border}
              style={{ width:"100%",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"9px 12px",fontSize:"12px",color:C.t2,lineHeight:1.65,fontFamily:"'JetBrains Mono',monospace" }}/>
          </div>
        </div>
      )}
    </div>
  );
}

      {/* ── TOPBAR ── */}
      <div style={{ padding:"0 22px",borderBottom:`1px solid ${C.border}`,background:C.glass,backdropFilter:"blur(24px)",position:"sticky",top:0,zIndex:20 }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",height:"54px" }}>

          {/* Logo */}
          <div style={{ display:"flex",alignItems:"center",gap:"10px" }}>
            <div style={{
              width:"28px",height:"28px",borderRadius:"8px",
              background:`linear-gradient(135deg,${C.primary},${C.pDark})`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"13px",color:"#fff",
              boxShadow:`0 3px 12px rgba(74,124,199,0.45)`,
            }}>◈</div>
            <div>
              <span style={{ fontFamily:"'Syne',sans-serif",fontSize:"14px",fontWeight:700,color:C.t1 }}>Habitus OS</span>
              <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"8px",color:C.t4,letterSpacing:"0.1em",display:"block",marginTop:"1px" }}>ADELSON · ADERRY</span>
            </div>
          </div>

          {/* Week dots + clock */}
          <div style={{ display:"flex",alignItems:"center",gap:"14px" }}>
            <div className="wdots" style={{ display:"flex",gap:"3px" }}>
              {WEEK.map(w=>{
                const isT=w.day===todayShort;
                return (
                  <div key={w.day} title={`${w.full} · ${w.tag}`} style={{
                    width:"26px",height:"26px",borderRadius:"7px",
                    background:isT?w.color:C.card,
                    border:`1px solid ${isT?w.color:C.border}`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontFamily:"'JetBrains Mono',monospace",fontSize:"8px",
                    fontWeight:isT?700:400,color:isT?"#fff":C.t4,
                  }}>{w.day.charAt(0)}</div>
                );
              })}
            </div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"12px",color:C.t2,letterSpacing:"0.04em" }}>
              {fmtTime(now)}
            </div>
          </div>
        </div>

        {/* Day progress */}
        <div style={{ height:"2px",background:C.border }}>
          <div style={{ height:"100%",width:`${dayFrac*100}%`,background:`linear-gradient(90deg,${C.primary},${todayWS.color})`,transition:"width 60s linear" }}/>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex",overflowX:"auto" }}>
          {TABS.map(t=>(
            <button key={t.k} className="tab" onClick={()=>setTab(t.k)} style={{
              padding:"10px 16px",fontFamily:"'JetBrains Mono',monospace",
              fontSize:"9px",letterSpacing:"0.14em",textTransform:"uppercase",
              color:tab===t.k?C.pSoft:C.t3,
              borderBottom:tab===t.k?`2px solid ${C.primary}`:"2px solid transparent",
              marginBottom:"-1px",whiteSpace:"nowrap",
            }}>{t.l}</button>
          ))}
        </div>
      </div>

      {/* ── CONTENT ── */}
      <div style={{ padding:"24px 22px 64px",maxWidth:"900px",margin:"0 auto" }}>
        {tab==="hub"      && <HubView      todayWS={todayWS} />}
        {tab==="rotina"   && <RotinaView   now={now} todayWS={todayWS} />}
        {tab==="template" && <TemplateView now={now} todayWS={todayWS} allData={allData} setAllData={setAllData} />}
        {tab==="semana"   && <SemanaView   todayShort={todayShort} />}
        {tab==="arquivo"  && <ArquivoView  allData={allData} />}
      </div>

      {/* ── FOOTER ── */}
      <div style={{ borderTop:`1px solid ${C.border}`,padding:"15px 22px",display:"flex",justifyContent:"space-between",alignItems:"center",background:C.glass,backdropFilter:"blur(12px)" }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4,letterSpacing:"0.1em" }}>HABITUS OS · ADELSON · ADERRY</div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:C.t4 }}>
          {now.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HabitusAdelson />);
</script>
</body>
</html>
