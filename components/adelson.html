function Field({ label, value, onChange, big, placeholder }) {
  const base = {
    width:"100%", background:C.inputBg, border:`1px solid ${C.border}`,
    borderRadius:"8px", padding: big ? "10px 13px" : "8px 12px",
    fontSize:"13px", color:C.t2, lineHeight:1.6,
  };
  return (
    <div style={{ marginBottom:"10px" }}>
      <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, letterSpacing:"0.14em", textTransform:"uppercase", marginBottom:"5px" }}>{label}</div>
      {big
        ? <textarea rows={3} value={value} onChange={e=>onChange(e.target.value)}
            placeholder={placeholder||""}
            onFocus={e=>e.target.style.borderColor=C.pSoft} onBlur={e=>e.target.style.borderColor=C.border}
            style={{...base, resize:"vertical"}} />
        : <input type="text" value={value} onChange={e=>onChange(e.target.value)}
            placeholder={placeholder||""}
            onFocus={e=>e.target.style.borderColor=C.pSoft} onBlur={e=>e.target.style.borderColor=C.border}
            style={{...base}} />
      }
    </div>
  );
}

function Label({ text, color, bg, border }) {
  return (
    <span style={{
      fontFamily:"'JetBrains Mono',monospace", fontSize:"8px",
      letterSpacing:"0.14em", textTransform:"uppercase", fontWeight:600,
      color:color||C.pSoft, background:bg||C.pGlow,
      border:`1px solid ${border||C.borderB}`,
      padding:"2px 8px", borderRadius:"4px",
    }}>{text}</span>
  );
}

/* ═══════════════════════════════════════
   EXPORT
═══════════════════════════════════════ */
function exportDay(dayData, dateStr, weekDay) {
  const wd = WEEK.find(w=>w.day===weekDay) || WEEK[0];
  let out = `HABITUS OS · ADELSON\n${dateStr.toUpperCase()}\nTema: ${wd.tag}\n${"─".repeat(48)}\n\n`;
  BLOCKS.forEach(b => {
    const bd = dayData.blocks[b.id] || {};
    const icon = bd.done ? "[✓]" : "[ ]";
    out += `${icon} ${b.time}  ${b.label} (${b.dur})\n`;
    if (bd.intention) out += `    Intenção: ${bd.intention}\n`;
    if (b.fields) b.fields.forEach(f => {
      const v = (bd.extras||{})[f.key];
      if (v) out += `    ${f.label}: ${v}\n`;
    });
    if (bd.notes) out += `    Notas: ${bd.notes}\n`;
    out += "\n";
  });
  const rev = dayData.review || {};
  out += `${"─".repeat(48)}\nREVISÃO DO DIA\n\n`;
  if (rev.learned)   out += `O que aprendi: ${rev.learned}\n\n`;
  if (rev.thinking)  out += `O meu pensamento avançou: ${rev.thinking}\n\n`;
  if (rev.silence)   out += `O silêncio mostrou: ${rev.silence}\n\n`;
  if (rev.gratitude?.some(g=>g)) out += `Gratidão: ${rev.gratitude.filter(g=>g).join(" · ")}\n\n`;
  if (rev.score)     out += `Nota do dia: ${rev.score}/5\n`;
  return out;
}

}

/* ── ROTINA ── */
function RotinaView({ now, todayWS }) {
  const [expanded, setExpanded] = useState(null);
  const nowMin = now.getHours()*60 + now.getMinutes();

  function isCurrent(b) {
    if (b.id === "n5") return false;
    const s = hhmm(b.time), e = hhmm(b.end);
    return nowMin >= s && nowMin < e;
  }

  return (
    <div className="fadein">
      {/* Today theme */}
      <div style={{
        background:`linear-gradient(135deg, ${todayWS.color}14, ${todayWS.color}06)`,
        border:`1px solid ${todayWS.color}30`,
        borderRadius:"14px", padding:"18px 22px", marginBottom:"24px",
      }}>
        <div style={{ display:"flex", alignItems:"center", gap:"9px", marginBottom:"8px" }}>
          <Label text={todayWS.tag} color={todayWS.color} bg={`${todayWS.color}18`} border={`${todayWS.color}35`} />
          <span className="live" style={{ width:"5px", height:"5px", borderRadius:"50%", background:todayWS.color, display:"inline-block" }}/>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t3 }}>HOJE · {todayWS.full.toUpperCase()}</span>
        </div>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"14px", fontStyle:"italic", color:C.t2, lineHeight:1.5, marginBottom:"5px" }}>
          Estudo: {todayWS.study}
        </div>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:C.t3 }}>
          Conteúdo → {todayWS.content}
        </div>
      </div>

      {PERIODS.map(p => {
        const pBlocks = BLOCKS.filter(b => b.period === p.id);
        return (
          <div key={p.id} style={{ marginBottom:"26px" }}>
            <div style={{ display:"flex", alignItems:"center", gap:"12px", marginBottom:"10px" }}>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", textTransform:"uppercase", color:p.color, fontWeight:600 }}>
                {p.icon} {p.label}
              </div>
              <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg, ${p.color}35, transparent)` }}/>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4 }}>{p.timeRange}</div>
            </div>
            <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:"13px", overflow:"hidden", boxShadow:`0 2px 16px ${C.shadow}` }}>
              {pBlocks.map((b, bi) => {
                const cur  = isCurrent(b);
                const open = expanded === b.id;
                return (
                  <div key={b.id} className={`block-row ${cur?"current":""}`}
                    onClick={() => setExpanded(open?null:b.id)}
                    style={{
                      display:"grid", gridTemplateColumns:"72px 90px 1fr 18px",
                      alignItems:"center", gap:"12px", padding:"13px 18px",
                      borderBottom: bi<pBlocks.length-1 ? `1px solid ${C.border}` : "none",
                      background: cur ? `${p.color}14` : open ? `${p.color}08` : "transparent",
                      borderLeft: cur ? `3px solid ${p.color}` : open ? `3px solid ${p.color}70` : "3px solid transparent",
                    }}>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:(cur||open)?p.color:C.t3, fontWeight:(cur||open)?600:400, display:"flex", alignItems:"center", gap:"5px" }}>
                      {cur && <span className="live" style={{ width:"5px", height:"5px", borderRadius:"50%", background:p.color, display:"inline-block", flexShrink:0 }}/>}
                      {b.time}
                    </div>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:p.color, background:`${p.color}18`, borderRadius:"5px", padding:"3px 8px", textAlign:"center", whiteSpace:"nowrap" }}>{b.dur}</div>
                    <div>
                      <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:(cur||open)?600:400, color:(cur||open)?C.t1:C.t2 }}>{b.label}</div>
                      {open && <div className="fadein" style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:C.t3, marginTop:"5px", lineHeight:1.65 }}>{b.desc}</div>}
                    </div>
                    <div style={{ color:open?p.color:C.t4, fontSize:"16px", transition:"transform 0.2s", transform:open?"rotate(90deg)":"none", textAlign:"center", userSelect:"none" }}>›</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ── TEMPLATE ── */
function TemplateView({ now, todayWS, allData, setAllData }) {
  const [viewDate, setViewDate] = useState(new Date(now));
  const vKey = dateKey(viewDate);
  const vShort = ALL_DAYS[viewDate.getDay()];
  const vWS = WEEK.find(w=>w.day===vShort) || WEEK[0];
  const isToday = vKey === dateKey(now);

  const dayData = useMemo(() => loadDay(vKey, allData), [vKey, allData]);

  const update = useCallback((fn) => {
    setAllData(a => {
      const next = { ...a, [vKey]: fn(loadDay(vKey, a)) };
      saveAll(next);
      return next;
    });
  }, [vKey]);

  const setBlockField = (bid, field, val) => update(d => ({
    ...d, blocks: { ...d.blocks, [bid]: { ...(d.blocks[bid]||{}), [field]:val } }
  }));
  const setExtra = (bid, key, val) => update(d => ({
    ...d, blocks: { ...d.blocks, [bid]: { ...(d.blocks[bid]||{}), extras:{ ...((d.blocks[bid]||{}).extras||{}), [key]:val } } }
  }));
  const setReview = (field, val) => update(d => ({
    ...d, review: { ...(d.review||{}), [field]:val }
  }));
  const setGratitude = (i, val) => update(d => {
    const g = [...((d.review||{}).gratitude||["","",""])];
    g[i] = val;
    return { ...d, review:{ ...(d.review||{}), gratitude:g } };
  });

  const shiftDay = n => setViewDate(d => { const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; });

  const doExport = () => {
    const txt = exportDay(dayData, fmtDate(viewDate), vShort);
    const el = document.createElement("a");
    el.href = "data:text/plain;charset=utf-8," + encodeURIComponent(txt);
    el.download = `habitus-adelson-${vKey}.txt`;
    el.click();
  };

  const rev = dayData.review || {};
  const doneCount = BLOCKS.filter(b => (dayData.blocks[b.id]||{}).done).length;

  return (
    <div className="fadein">
      {/* Date nav + export */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", background:C.surface, border:`1px solid ${C.border}`, borderRadius:"12px", padding:"12px 18px", marginBottom:"22px", boxShadow:`0 2px 12px ${C.shadowB}` }}>
        <button className="ibtn" onClick={()=>shiftDay(-1)} style={{ width:"32px", height:"32px", borderRadius:"8px", background:C.card, border:`1px solid ${C.border}`, color:C.t3, display:"flex", alignItems:"center", justifyContent:"center" }}><Prev/></button>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"15px", fontWeight:600, color:C.t1 }}>
            {fmtDate(viewDate)}
          </div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, marginTop:"2px" }}>
            {isToday && <span style={{ color:C.green }}>HOJE · </span>}
            {vWS.tag} · {doneCount}/{BLOCKS.length} blocos concluídos
          </div>
        </div>
        <div style={{ display:"flex", gap:"8px" }}>
          <button className="ibtn" onClick={()=>shiftDay(1)} style={{ width:"32px", height:"32px", borderRadius:"8px", background:C.card, border:`1px solid ${C.border}`, color:C.t3, display:"flex", alignItems:"center", justifyContent:"center" }}><Next/></button>
          <button className="ibtn" onClick={doExport} title="Exportar dia" style={{ width:"32px", height:"32px", borderRadius:"8px", background:C.card, border:`1px solid ${C.border}`, color:C.pSoft, display:"flex", alignItems:"center", justifyContent:"center" }}><ExportIco/></button>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ height:"3px", background:C.border, borderRadius:"2px", marginBottom:"22px" }}>
        <div style={{ height:"100%", width:`${(doneCount/BLOCKS.length)*100}%`, background:`linear-gradient(90deg, ${C.primary}, ${C.green})`, borderRadius:"2px", transition:"width 0.3s" }}/>
      </div>

      {/* Blocks by period */}
      {PERIODS.map(p => {
        const pBlocks = BLOCKS.filter(b => b.period === p.id);
        return (
          <div key={p.id} style={{ marginBottom:"28px" }}>
            <div style={{ display:"flex", alignItems:"center", gap:"12px", marginBottom:"10px" }}>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", textTransform:"uppercase", color:p.color, fontWeight:600 }}>
                {p.icon} {p.label}
              </div>
              <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg,${p.color}35,transparent)` }}/>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
              {pBlocks.map(b => {
                const bd = dayData.blocks[b.id] || {};
                return (
                  <BlockTemplate key={b.id} block={b} data={bd} periodColor={p.color}
                    onDone={v     => setBlockField(b.id,"done",v)}
                    onIntent={v   => setBlockField(b.id,"intention",v)}
                    onNotes={v    => setBlockField(b.id,"notes",v)}
                    onExtra={(k,v)=> setExtra(b.id,k,v)}
                  />
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Day Review */}
      <div style={{ background:`linear-gradient(135deg, ${C.goldBg}, rgba(196,147,63,0.04))`, border:`1px solid ${C.goldBrd}`, borderRadius:"14px", padding:"24px 26px", marginTop:"10px" }}>
        <h3 style={{ fontFamily:"'Playfair Display',serif", fontSize:"17px", fontWeight:600, fontStyle:"italic", color:C.goldSoft, marginBottom:"20px" }}>
          Revisão do Dia
        </h3>
        <Field label="O que aprendi hoje que não sabia ontem?" value={rev.learned||""} onChange={v=>setReview("learned",v)} big placeholder="O conhecimento novo — mesmo que pequeno..." />
        <Field label="O meu pensamento avançou? Em que direcção?" value={rev.thinking||""} onChange={v=>setReview("thinking",v)} big placeholder="Reflexão sobre o avanço intelectual do dia..." />
        <Field label="O que o silêncio de hoje me mostrou?" value={rev.silence||""} onChange={v=>setReview("silence",v)} big placeholder="O que emergiu nos momentos quietos..." />

        <div style={{ marginBottom:"14px" }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, letterSpacing:"0.14em", textTransform:"uppercase", marginBottom:"8px" }}>Gratidão (3 coisas)</div>
          <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
            {[0,1,2].map(i => (
              <input key={i} type="text" value={(rev.gratitude||["","",""])[i]||""} onChange={e=>setGratitude(i,e.target.value)}
                placeholder={`${i+1}.`}
                onFocus={e=>e.target.style.borderColor=C.gold} onBlur={e=>e.target.style.borderColor=C.border}
                style={{ width:"100%", background:C.inputBg, border:`1px solid ${C.border}`, borderRadius:"8px", padding:"8px 12px", fontSize:"13px", color:C.t2 }}
              />
            ))}
          </div>
        </div>

        <div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, letterSpacing:"0.14em", textTransform:"uppercase", marginBottom:"8px" }}>Nota do dia</div>
          <div style={{ display:"flex", gap:"8px" }}>
            {[1,2,3,4,5].map(n => (
              <button key={n} className="ibtn" onClick={()=>setReview("score",rev.score===n?0:n)} style={{
                width:"40px", height:"40px", borderRadius:"10px",
                background: rev.score>=n ? `${C.gold}25` : C.card,
                border:`1px solid ${rev.score>=n ? C.gold : C.border}`,
                color: rev.score>=n ? C.gold : C.t4,
                fontFamily:"'Playfair Display',serif", fontSize:"16px", fontWeight:600,
              }}>{n}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function BlockTemplate({ block: b, data: bd, periodColor, onDone, onIntent, onNotes, onExtra }) {
  const [open, setOpen] = useState(false);
  const done = bd.done || false;

  return (
    <div style={{
      background: done ? C.greenBg : C.card,
      border:`1px solid ${done ? C.green+"30" : (open ? `${periodColor}30` : C.border)}`,
      borderRadius:"12px", overflow:"hidden",
      boxShadow:`0 1px 8px ${C.shadowB}`,
    }}>
      {/* Header row */}
      <div style={{ display:"grid", gridTemplateColumns:"auto 72px 90px 1fr auto", alignItems:"center", gap:"12px", padding:"12px 16px", cursor:"pointer" }}
        onClick={()=>setOpen(!open)}>
        {/* Checkbox */}
        <button className="ibtn" onClick={e=>{e.stopPropagation();onDone(!done)}} style={{
          width:"22px", height:"22px", borderRadius:"6px",
          background: done ? C.green : "transparent",
          border:`2px solid ${done ? C.green : C.t4}`,
          display:"flex", alignItems:"center", justifyContent:"center",
          color:"#fff", flexShrink:0,
        }}>
          {done && <CheckIco/>}
        </button>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"11px", color:done?C.t3:periodColor }}>{b.time}</div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:periodColor, background:`${periodColor}18`, borderRadius:"4px", padding:"3px 8px", textAlign:"center", whiteSpace:"nowrap" }}>{b.dur}</div>
        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", fontWeight:open?600:400, color:done?C.t3:(open?C.t1:C.t2), textDecoration:done?"line-through":"none" }}>{b.label}</div>
        <div style={{ color:open?periodColor:C.t4, fontSize:"16px", transition:"transform 0.2s", transform:open?"rotate(90deg)":"none" }}>›</div>
      </div>

      {/* Expanded */}
      {open && (
        <div className="fadein" style={{ borderTop:`1px solid ${C.border}`, padding:"16px 18px", display:"flex", flexDirection:"column", gap:"0" }}>
          <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"12px", color:C.t3, lineHeight:1.65, marginBottom:"14px" }}>{b.desc}</div>

          {/* Special fields */}
          {b.fields && b.fields.map(f => (
            <Field key={f.key} label={f.label} big={f.big}
              value={(bd.extras||{})[f.key]||""}
              onChange={v=>onExtra(f.key,v)}
            />
          ))}
          {/* Reflection block: big free text */}
          {b.type==="reflexao" && (
            <div style={{ marginBottom:"10px" }}>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, letterSpacing:"0.14em", textTransform:"uppercase", marginBottom:"5px" }}>Diário de pensamento</div>
              <textarea rows={6} value={(bd.extras||{}).diario||""} onChange={e=>onExtra("diario",e.target.value)}
                placeholder={"Espaço livre. Escreve o que vier — ideias, intuições, fragmentos..."}
                onFocus={e=>e.target.style.borderColor=C.pSoft} onBlur={e=>e.target.style.borderColor=C.border}
                style={{ width:"100%", background:C.inputBg, border:`1px solid ${C.border}`, borderRadius:"8px", padding:"10px 13px", fontSize:"13px", color:C.t2, lineHeight:1.7, resize:"vertical", marginBottom:"10px" }}
              />
            </div>
          )}

          <Field label="Intenção do bloco" value={bd.intention||""} onChange={onIntent} placeholder="O que quero que este tempo produza?" />
          <Field label="Notas livres" value={bd.notes||""} onChange={onNotes} big placeholder="Pensamentos, observações, o que surgiu..." />
        </div>
      )}
    </div>
  );
}

/* ── ARQUIVO ── */
function ArquivoView({ allData }) {
  const keys = Object.keys(allData).sort((a,b)=>b.localeCompare(a)).slice(0,30);
  if (!keys.length) return (
    <div className="fadein" style={{ textAlign:"center", padding:"60px 0" }}>
      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"18px", fontStyle:"italic", color:C.t3, marginBottom:"8px" }}>O arquivo está vazio</div>
      <div style={{ fontFamily:"'Inter',sans-serif", fontSize:"13px", color:C.t4 }}>Os dias preenchidos no template aparecerão aqui.</div>
    </div>
  );

  return (
    <div className="fadein">
      <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:"18px", fontWeight:600, color:C.t1, marginBottom:"18px" }}>Arquivo de Dias</h2>
      <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
        {keys.map(k => {
          const d    = allData[k];
          const dt   = new Date(k+"T06:00:00");
          const ws   = WEEK.find(w=>w.day===ALL_DAYS[dt.getDay()]) || WEEK[0];

          return (
            <div key={k} style={{
              background:C.surface, border:`1px solid ${C.border}`,
              borderRadius:"12px", padding:"14px 18px",
              display:"grid", gridTemplateColumns:"1fr auto auto auto",
              gap:"16px", alignItems:"center",
            }}>
              <div>
                <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"14px", color:C.t1, marginBottom:"3px" }}>
                  {dt.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
                </div>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:ws.color }}>{ws.tag}</div>
              </div>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"14px", color:done===BLOCKS.length?C.green:C.pSoft }}>{done}/{BLOCKS.length}</div>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4 }}>blocos</div>
              </div>
              {score>0 && (
                <div style={{ textAlign:"center" }}>
                  <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"18px", color:C.gold, lineHeight:1 }}>{score}</div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4 }}>nota</div>
                </div>
              )}
              <button className="ibtn" onClick={() => {
                const txt = exportDay(d, dt.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}), ALL_DAYS[dt.getDay()]);
                const el = document.createElement("a");
                el.href = "data:text/plain;charset=utf-8," + encodeURIComponent(txt);
                el.download = `habitus-adelson-${k}.txt`; el.click();
              }} style={{ width:"30px", height:"30px", borderRadius:"8px", background:C.card, border:`1px solid ${C.border}`, color:C.t3, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <ExportIco/>
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   MAIN APP
═══════════════════════════════════════ */
function HabitusAdelson() {
  const [tab, setTab]       = useState("hub");
  const [now, setNow]       = useState(new Date());
  const [allData, setAllData] = useState(() => loadAll());

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t);
  }, []);

  const todayShort = ALL_DAYS[now.getDay()];
  const todayWS    = WEEK.find(w=>w.day===todayShort) || WEEK[0];
  const timeStr    = fmtTime(now);
  const dayFrac    = (now.getHours()*60+now.getMinutes())/(24*60);
  const dc         = todayWS.color;

  const TABS = [
    { key:"hub",      label:"Hub"       },
    { key:"rotina",   label:"Rotina"    },
    { key:"template", label:"Template"  },
    { key:"semana",   label:"Semana"    },
    { key:"arquivo",  label:"Arquivo"   },
  ];

  return (
    <div style={{ minHeight:"100vh", background:C.bg, color:C.t1, fontFamily:"'Inter',system-ui,sans-serif" }}>

      {/* ── TOPBAR ── */}
      <div style={{ padding:"0 24px", borderBottom:`1px solid ${C.border}`, background:C.glass, backdropFilter:"blur(24px)", position:"sticky", top:0, zIndex:20 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", height:"56px" }}>

          {/* Logo */}
          <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
            <div style={{
              width:"30px", height:"30px", borderRadius:"8px",
              background:`linear-gradient(135deg, ${C.primary}, #1A4E87)`,
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:"14px", color:"#fff",
              boxShadow:`0 3px 12px rgba(43,107,176,0.45)`,
            }}>◈</div>
            <div>
              <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"14px", fontWeight:700, color:C.t1, lineHeight:1.2 }}>Habitus OS</div>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4, letterSpacing:"0.1em" }}>ADELSON · ADERRY</div>
            </div>
          </div>

          {/* Right */}
          <div className="topbar-right" style={{ display:"flex", alignItems:"center", gap:"16px" }}>
            {/* Week dots */}
            <div className="week-dots" style={{ display:"flex", gap:"3px" }}>
              {WEEK.map(w => {
                const isT = w.day === todayShort;
                return (
                  <div key={w.day} title={`${w.full} · ${w.tag}`} style={{
                    width:"26px", height:"26px", borderRadius:"7px",
                    background: isT ? w.color : C.card,
                    border:`1px solid ${isT ? w.color : C.border}`,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontFamily:"'JetBrains Mono',monospace", fontSize:"8px",
                    fontWeight:isT?700:400, color:isT?"#fff":C.t4,
                  }}>{w.day.charAt(0)}</div>
                );
              })}
            </div>
            {/* Clock */}
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"13px", color:C.t2, letterSpacing:"0.04em" }}>{timeStr}</div>
          </div>
        </div>

        {/* Day progress */}
        <div style={{ height:"2px", background:C.border }}>
          <div style={{ height:"100%", width:`${dayFrac*100}%`, background:`linear-gradient(90deg, ${C.primary}, ${dc})`, transition:"width 60s linear" }}/>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex", gap:"0", overflowX:"auto" }}>
          {TABS.map(t => (
            <button key={t.key} className="tab-btn" onClick={()=>setTab(t.key)} style={{
              padding:"10px 16px", fontFamily:"'JetBrains Mono',monospace",
              fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase",
              color: tab===t.key ? C.pSoft : C.t3,
              borderBottom: tab===t.key ? `2px solid ${C.primary}` : "2px solid transparent",
              marginBottom:"-1px", whiteSpace:"nowrap",
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* ── CONTENT ── */}
      <div style={{ padding:"26px 24px 64px", maxWidth:"920px", margin:"0 auto" }}>
        {tab==="hub"      && <HubView      now={now} todayWS={todayWS} />}
        {tab==="rotina"   && <RotinaView   now={now} todayWS={todayWS} />}
        {tab==="template" && <TemplateView now={now} todayWS={todayWS} allData={allData} setAllData={setAllData} />}
        {tab==="semana"   && <SemanaView   now={now} />}
        {tab==="arquivo"  && <ArquivoView  allData={allData} />}
      </div>

      {/* ── FOOTER ── */}
      <div style={{ borderTop:`1px solid ${C.border}`, padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", background:C.glass, backdropFilter:"blur(12px)" }}>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:"11px", fontStyle:"italic", color:C.t4 }}>
          Habitus OS · Adelson · Aderry
        </div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4 }}>
          {now.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HabitusAdelson />);
</script>
</body>
</html>
