<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Habitus OS — Aderry</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t1);
  transition:background-color 0.3s,color 0.3s,border-color 0.3s,box-shadow 0.3s;
  padding-bottom:80px;min-height:100%}
[data-theme="dark"]{
  --bg:#0D0910;--surface:#130D1A;--card:#1A1025;--t1:#EDE8F5;--t2:#8B7AA0;
  --border:rgba(107,33,168,0.2);--border-h:rgba(107,33,168,0.4);
  --accent:#7F77DD;--accent-bg:rgba(127,119,221,0.1);--accent-bg-h:rgba(127,119,221,0.15);
  --shadow:rgba(0,0,0,0.5);--green:#4CAF82;--green-bg:#1a3a2a;--done-text:#7ECFAC;
  --gold:#C4933F;--header-bg:rgba(13,9,16,0.95)
}
[data-theme="light"]{
  --bg:#F5F3FF;--surface:#FFFFFF;--card:#FAF8FF;--t1:#1A0A2E;--t2:#5A4A6A;
  --border:rgba(107,33,168,0.15);--border-h:rgba(107,33,168,0.35);
  --accent:#6B21A8;--accent-bg:rgba(107,33,168,0.06);--accent-bg-h:rgba(107,33,168,0.1);
  --shadow:rgba(0,0,0,0.08);--green:#16a34a;--green-bg:#f0fdf4;--done-text:#15803d;
  --gold:#b45309;--header-bg:rgba(245,243,255,0.95)
}
/* ---- HEADER ---- */
#app-header{
  position:sticky;top:0;z-index:100;height:56px;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:var(--header-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);box-shadow:0 2px 12px var(--shadow)
}
.logo{font-family:Montserrat,sans-serif;font-size:15px;font-weight:600;
  color:var(--t1);letter-spacing:0.02em;user-select:none}
.logo span{color:var(--accent)}
#clock{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:400;
  color:var(--t2);letter-spacing:0.05em;min-width:70px;text-align:center}
.header-actions{display:flex;gap:4px;align-items:center}
.icon-btn{
  width:36px;height:36px;min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;border-radius:8px;
  color:var(--t2);transition:background 0.15s,color 0.15s
}
.icon-btn:hover{background:var(--accent-bg);color:var(--accent)}
/* ---- DESKTOP TABS ---- */
#desktop-tabs{
  display:none;align-items:center;
  border-bottom:1px solid var(--border);
  background:var(--surface);padding:0 16px;gap:4px
}
@media(min-width:768px){
  #desktop-tabs{display:flex}
  #bottom-nav{display:none !important}
  body{padding-bottom:0}
  .view-container{max-width:720px;margin:0 auto}
}
.tab-btn{
  display:flex;align-items:center;gap:6px;padding:12px 16px;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;
  text-transform:uppercase;letter-spacing:0.12em;color:var(--t2);
  background:transparent;border:none;border-bottom:2px solid transparent;
  cursor:pointer;transition:color 0.2s,border-color 0.2s;white-space:nowrap
}
.tab-btn svg{width:13px;height:13px;flex-shrink:0}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--t1)}
/* ---- BOTTOM NAV ---- */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:68px;
  display:flex;align-items:center;
  background:var(--surface);border-top:1px solid var(--border);z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0)
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;border:none;background:transparent;cursor:pointer;
  color:var(--t2);transition:color 0.2s;min-height:44px
}
.nav-item svg{width:18px;height:18px}
.nav-item span{font-family:'JetBrains Mono',monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:0.08em}
.nav-item.active{color:var(--accent)}
/* ---- VIEWS ---- */
.view{display:none}
.view.active{display:block}
/* ---- COMMON ---- */
.section-label{
  font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.12em;color:var(--t2);margin-bottom:8px
}
.section-heading{
  font-family:Montserrat,sans-serif;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.12em;color:var(--t2);
  padding:12px 16px 8px
}
/* ---- DIA TOP ---- */
#dia-top{padding:16px 16px 8px}
.date-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);margin-bottom:12px}
.prio-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prio-row{display:flex;align-items:center;gap:8px}
.prio-num{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
  color:var(--accent);min-width:16px;text-align:center
}
.prio-input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:9px 11px;font-family:Inter,sans-serif;font-size:13px;color:var(--t1);
  outline:none;transition:border-color 0.2s
}
.prio-input:focus{border-color:var(--border-h)}
.prio-input::placeholder{color:var(--t2)}
/* ---- PROGRESS ---- */
#progress-wrap{padding:8px 16px 12px}
.progress-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);margin-bottom:6px}
.progress-bar-bg{width:100%;height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-bar-fill{
  height:100%;background:var(--accent);border-radius:4px;
  transition:width 0.4s cubic-bezier(0.4,0,0.2,1)
}
/* ---- PERIOD SECTIONS ---- */
.period-section{margin-bottom:4px}
.period-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px 8px
}
.period-divider{flex:1;height:1px;background:var(--border)}
.period-label{
  font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.1em;color:var(--t2);white-space:nowrap
}
.period-range{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t2);white-space:nowrap
}
.period-badge{
  font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;
  border-radius:20px;border:1px solid var(--border);color:var(--t2);
  background:transparent;white-space:nowrap;
  transition:background 0.3s,border-color 0.3s,color 0.3s
}
.period-badge.active-period{
  background:var(--accent-bg);border-color:var(--accent);color:var(--accent)
}
.period-badge.done-period{
  background:var(--green-bg);border-color:rgba(76,175,130,0.4);color:var(--done-text)
}
/* ---- BLOCK CARDS ---- */
.blocks-list{padding:0 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.block-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;transition:background 0.1s,border-color 0.2s,opacity 0.3s,border-left-color 0.2s
}
.block-card:hover .block-header{background:var(--accent-bg-h)}
.block-card.now{border-left:3px solid var(--accent);background:var(--accent-bg)}
.block-card.past{opacity:0.7}
.block-card.done{background:var(--green-bg);border-color:rgba(76,175,130,0.25)}
.block-card.done .block-label{text-decoration:line-through;color:var(--done-text)}
/* block header grid */
.block-header{
  display:grid;grid-template-columns:20px 1fr 18px;
  align-items:center;gap:10px;padding:10px 12px;
  cursor:pointer;min-height:44px;transition:background 0.1s
}
/* checkbox */
.block-checkbox{
  width:18px;height:18px;border-radius:5px;
  border:1.5px solid var(--border-h);flex-shrink:0;
  position:relative;transition:background 0.2s,border-color 0.2s;cursor:pointer
}
.block-checkbox.checked{background:var(--green);border-color:var(--green)}
.block-checkbox.checked::after{
  content:'';position:absolute;left:3px;top:5px;
  width:10px;height:6px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg)
}
@keyframes checkPulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.block-checkbox.pulse{animation:checkPulse 0.2s ease}
/* block meta */
.block-meta{min-width:0;overflow:hidden}
.block-time-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.block-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2)}
.block-dur{
  font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;
  border-radius:6px;background:var(--accent-bg);color:var(--accent)
}
.now-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);display:none}
.block-card.now .now-badge{display:inline}
.block-label{
  font-family:Inter,sans-serif;font-size:14px;font-weight:500;color:var(--t1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.2s,text-decoration 0.2s
}
.block-chevron{
  font-size:15px;color:var(--t2);transition:transform 0.3s;
  user-select:none;justify-self:end;line-height:1
}
.block-card.open .block-chevron{transform:rotate(90deg)}
/* block body */
.block-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1)}
.block-card.open .block-body{max-height:900px}
.block-body-inner{padding:0 12px 14px}
.block-desc{font-size:12px;font-style:italic;color:var(--t2);margin-bottom:12px;line-height:1.6}
/* field groups */
.field-group{margin-bottom:8px}
.field-label{
  font-family:Inter,sans-serif;font-size:11px;font-weight:500;
  color:var(--t2);margin-bottom:4px;display:block
}
.field-input{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-family:Inter,sans-serif;font-size:13px;color:var(--t1);
  outline:none;transition:border-color 0.2s;resize:none;overflow:hidden;
  line-height:1.5
}
.field-input:focus{border-color:var(--border-h)}
.field-input::placeholder{color:var(--t2)}
textarea.field-input{min-height:60px}
textarea.field-input.large{min-height:100px}
.notes-label{
  font-family:Inter,sans-serif;font-size:11px;font-weight:500;
  color:var(--t2);margin-top:10px;margin-bottom:4px;display:block;
  padding-top:8px;border-top:1px solid var(--border)
}
/* ---- REVIEW SECTION ---- */
.review-section{padding:0 16px 12px}
.review-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:12px
}
/* score */
.score-row{display:flex;gap:6px;margin-top:4px}
.score-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);font-family:'JetBrains Mono',monospace;font-size:13px;
  color:var(--t2);cursor:pointer;transition:background 0.2s,color 0.2s,border-color 0.2s;
  flex-shrink:0
}
.score-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.score-btn:hover:not(.active){background:var(--accent-bg);border-color:var(--border-h);color:var(--accent)}
/* ---- AMANHA SECTION ---- */
.amanha-section{padding:0 16px 12px}
.amanha-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;cursor:pointer;transition:background 0.1s;text-align:left
}
.amanha-toggle:hover{background:var(--accent-bg-h)}
.amanha-toggle-label{
  font-family:Montserrat,sans-serif;font-size:13px;font-weight:500;color:var(--t1)
}
.amanha-chevron{font-size:15px;color:var(--t2);transition:transform 0.3s}
.amanha-chevron.open{transform:rotate(90deg)}
.amanha-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1)}
.amanha-body.open{max-height:1000px}
.amanha-body-inner{
  background:var(--card);border:1px solid var(--border);border-top:none;
  border-radius:0 0 12px 12px;padding:12px 16px 16px;
  display:flex;flex-direction:column;gap:10px
}
.amanha-tema-wrap{
  padding:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;display:flex;flex-direction:column;gap:4px
}
.tema-tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  font-weight:500;letter-spacing:0.08em;margin-bottom:2px
}
.tema-study{font-size:12px;color:var(--t2);line-height:1.5}
/* ---- EXPORT BTN ---- */
.export-wrap{padding:4px 16px 24px}
.export-btn{
  width:100%;padding:12px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;font-family:Montserrat,sans-serif;font-size:12px;font-weight:500;
  letter-spacing:0.08em;color:var(--t2);cursor:pointer;
  transition:background 0.2s,color 0.2s,border-color 0.2s
}
.export-btn:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--border-h)}
.export-btn.copied{background:var(--green-bg);color:var(--done-text);border-color:rgba(76,175,130,0.4)}
/* ---- WELCOME BANNER ---- */
#welcome-banner{
  margin:16px;padding:16px;background:var(--accent-bg);
  border:1px solid var(--accent);border-radius:12px;
  display:flex;flex-direction:column;gap:10px
}
.welcome-title{font-family:Montserrat,sans-serif;font-size:14px;font-weight:600;color:var(--accent)}
.welcome-text{font-size:13px;color:var(--t2);line-height:1.6}
.welcome-cta{
  align-self:flex-start;padding:9px 18px;background:var(--accent);border:none;
  border-radius:8px;font-family:Montserrat,sans-serif;font-size:12px;font-weight:600;
  color:#fff;cursor:pointer;transition:opacity 0.2s
}
.welcome-cta:hover{opacity:0.85}
/* ---- SEMANA VIEW ---- */
#semana-view{padding:16px}
.semana-scroll{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:8px;-ms-overflow-style:none;scrollbar-width:none
}
.semana-scroll::-webkit-scrollbar{display:none}
.week-card{
  min-width:140px;width:140px;flex-shrink:0;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:14px;
  cursor:pointer;scroll-snap-align:start;
  transition:border-color 0.2s,background 0.2s,outline 0.15s
}
.week-card.today-card{min-width:155px;width:155px;border-color:var(--accent);background:var(--accent-bg)}
.week-card:hover{border-color:var(--border-h);background:var(--accent-bg-h)}
.week-card.selected-card{outline:2px solid var(--accent);outline-offset:2px}
.wc-day{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;margin-bottom:2px}
.wc-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:400;color:var(--t1);margin-bottom:8px}
.wc-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 7px;
  border-radius:20px;display:inline-block;
  letter-spacing:0.04em;line-height:1.4
}
#week-detail{
  margin-top:16px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px;display:none
}
#week-detail.visible{display:block}
.wd-full-day{font-family:Montserrat,sans-serif;font-size:16px;font-weight:600;margin-bottom:4px}
.wd-tag{font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:14px}
.wd-section-label{
  font-family:Montserrat,sans-serif;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.12em;color:var(--t2);margin-bottom:5px
}
.wd-text{font-size:13px;color:var(--t1);line-height:1.6;margin-bottom:14px}
/* ---- ARQUIVO VIEW ---- */
#arquivo-view{padding:16px}
.arquivo-list{display:flex;flex-direction:column;gap:6px}
.arquivo-row{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:border-color 0.2s,background 0.2s
}
.arquivo-row:hover{border-color:var(--border-h);background:var(--accent-bg-h)}
.arq-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);min-width:90px;flex-shrink:0}
.arq-snippet{flex:1;font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.arq-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2)}
.arq-score-dots{display:flex;gap:2px}
.arq-dot{width:5px;height:5px;border-radius:50%;background:var(--border)}
.arq-dot.filled{background:var(--accent)}
/* arquivo detail */
#arquivo-detail{display:none}
#arquivo-detail.visible{display:block}
.back-btn{
  display:flex;align-items:center;gap:6px;padding:8px 0 12px;
  background:transparent;border:none;font-family:Montserrat,sans-serif;
  font-size:13px;color:var(--t2);cursor:pointer;transition:color 0.2s
}
.back-btn:hover{color:var(--accent)}
.arq-detail-date{font-family:Montserrat,sans-serif;font-size:18px;font-weight:600;color:var(--t1);margin-bottom:16px}
.arq-blocks-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:12px
}
.arq-block-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--border)
}
.arq-block-row:last-child{border-bottom:none}
.arq-block-check{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--done-text);
  min-width:14px;flex-shrink:0
}
.arq-block-time{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);
  min-width:50px;flex-shrink:0
}
.arq-block-name{font-family:Inter,sans-serif;font-size:13px;color:var(--t1)}
.arq-block-name.done-arq{text-decoration:line-through;color:var(--t2)}
.arq-review-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:8px
}
.arq-review-label{
  font-family:Montserrat,sans-serif;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.1em;color:var(--t2);margin-bottom:5px
}
.arq-review-text{font-size:13px;color:var(--t1);line-height:1.6}
.arq-section-sep{margin-bottom:12px}
/* ---- PERFIL VIEW ---- */
#perfil-view{padding:16px}
.perfil-section{
  margin-bottom:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden
}
.perfil-header{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  cursor:pointer;transition:background 0.1s
}
.perfil-header:hover{background:var(--accent-bg-h)}
.perfil-header-left{display:flex;align-items:center;gap:10px}
.perfil-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);min-width:14px}
.perfil-title{font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:var(--t1)}
.perfil-chevron{font-size:15px;color:var(--t2);transition:transform 0.3s}
.perfil-chevron.open{transform:rotate(90deg)}
.perfil-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1)}
.perfil-body.open{max-height:1200px}
.perfil-body-inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
/* principle cards */
.principle-card{
  padding:13px;background:var(--surface);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;margin-bottom:4px
}
.principle-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-bottom:4px}
.principle-quote{font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:var(--t1);margin-bottom:5px}
.principle-body{font-size:12px;color:var(--t2);line-height:1.6}
/* save btn */
.save-perfil-btn{
  display:block;width:calc(100% - 32px);margin:6px 16px 16px;padding:13px;
  background:var(--accent);border:none;border-radius:10px;
  font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:#fff;
  cursor:pointer;transition:opacity 0.2s
}

// ===== STORAGE HELPERS =====
function loadProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProfile(data) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(data)); } catch(e) {}
}
function loadJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveJournal(data) {
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(data)); } catch(e) {}
}
function todayKey() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tomorrowKey() {
  const d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getTodayData() {
  const j = loadJournal();
  const k = todayKey();
  if (!j[k]) j[k] = {blocks:{}};
  if (!j[k].blocks) j[k].blocks = {};
  return j[k];
}
function setTodayData(data) {
  const j = loadJournal();
  j[todayKey()] = data;
  saveJournal(j);
}
function getDateData(dateKey) {
  const j = loadJournal();
  const d = j[dateKey] || {blocks:{}};
  if (!d.blocks) d.blocks = {};
  return d;
}

function timeToMins(t) {
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function nowMins() {
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}
function getActiveBlockId() {
  const nm = nowMins();
  for (const b of BLOCKS) {
    if (b.d === '—') continue;
    const start = timeToMins(b.t);
    const end   = timeToMins(b.e);
    if (end < start) {
      if (nm >= start || nm < end) return b.id;
    } else {
      if (nm >= start && nm < end) return b.id;
    }
  }
  return null;
}
function getBlockState(b) {
  if (b.d === '—') return 'sleep';
  const nm    = nowMins();
  const start = timeToMins(b.t);
  const end   = timeToMins(b.e);
  if (end < start) {
    if (nm >= start || nm < end) return 'now';
    return nm < start ? 'future' : 'past';
  }
  if (nm >= start && nm < end) return 'now';
  if (nm >= end) return 'past';
  return 'future';
}
function getPeriodState(p) {
  const pBlocks = BLOCKS.filter(b => b.p === p.id && b.d !== '—');
  if (pBlocks.length === 0) return 'future';
  const firstStart = timeToMins(pBlocks[0].t);
  const lastEnd    = timeToMins(pBlocks[pBlocks.length-1].e);
  const nm = nowMins();
  if (nm >= lastEnd)   return 'done';
  if (nm >= firstStart) return 'active';
  return 'future';
}

// ===== DATE FORMATTING =====
function formatDatePT(dateKey) {
  const parts = dateKey.split('-').map(Number);
  const date = new Date(parts[0], parts[1]-1, parts[2]);
  const days   = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return days[date.getDay()]+', '+parts[2]+' de '+months[parts[1]-1]+' de '+parts[0];
}
function formatDateShort(dateKey) {
  const [y,m,d] = dateKey.split('-');
  return d+'/'+m+'/'+y;
}

// ===== CLOCK =====
function updateClock() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,'0');
  const m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  const el = document.getElementById('clock');
  if (el) el.textContent = h+':'+m+':'+s;
  if (currentView === 'dia') updateBlockHighlights();
}

// ===== LIVE BLOCK HIGHLIGHTS =====
function updateBlockHighlights() {
  BLOCKS.forEach(b => {
    const card = document.querySelector('.block-card[data-id="'+b.id+'"]');
    if (!card) return;
    const state = getBlockState(b);
    card.classList.remove('now','past','future');
    if      (state === 'now')    card.classList.add('now');
    else if (state === 'past')   card.classList.add('past');
    else if (state === 'future') card.classList.add('future');
  });
  PERIODS.forEach(p => {
    const badge = document.querySelector('.period-badge[data-period="'+p.id+'"]');
    if (!badge) return;
    const state = getPeriodState(p);
    badge.classList.remove('active-period','done-period');
    if (state === 'active') {
      badge.textContent = 'Em curso ●';
      badge.classList.add('active-period');
    } else if (state === 'done') {
      badge.textContent = 'Completo ✓';
      badge.classList.add('done-period');
    } else {
      badge.textContent = 'A chegar ○';
    }
  });
  updateProgress();
  // Auto-expand active block once per dia view load
  if (!autoExpanded) {
    const activeId = getActiveBlockId();
    if (activeId) {
      autoExpanded = true;
      if (expandedBlock !== activeId) {
        expandedBlock = activeId;
        document.querySelectorAll('.block-card.open').forEach(c => c.classList.remove('open'));
        const ac = document.querySelector('.block-card[data-id="'+activeId+'"]');
        if (ac) {
          ac.classList.add('open');
          setTimeout(() => ac.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
        }
      }
    }
  }
}

// ===== PROGRESS =====
function updateProgress() {
  const data     = getTodayData();
  const countable = BLOCKS.filter(b => b.d !== '—');
  const done      = countable.filter(b => data.blocks[b.id] && data.blocks[b.id].done).length;
  const pct       = Math.round(done/countable.length*100);
  const lbl  = document.getElementById('progress-label');
  const fill = document.getElementById('progress-fill');
  if (lbl)  lbl.textContent  = done+' de '+countable.length+' blocos · '+pct+'%';
  if (fill) fill.style.width = pct+'%';
}

// ===== AUTO-RESIZE TEXTAREAS =====
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight+'px';
}
function initAutoResize(container) {
  if (!container) return;
  container.querySelectorAll('textarea').forEach(ta => {
    autoResize(ta);
  });
}

// ===== RENDER DIA VIEW =====
function renderDia() {
  const data  = getTodayData();
  const yData = getDateData(yesterdayKey());
  const key   = todayKey();

  // Date label
  const todayLbl = document.getElementById('today-label');
  if (todayLbl) todayLbl.textContent = formatDatePT(key);

  // Priorities
  const p1 = document.getElementById('prio-1');
  const p2 = document.getElementById('prio-2');
  const p3 = document.getElementById('prio-3');
  if (p1) p1.value = data.prio1 || yData.amanha_prio1 || '';
  if (p2) p2.value = data.prio2 || yData.amanha_prio2 || '';
  if (p3) p3.value = data.prio3 || yData.amanha_prio3 || '';

  // Review fields
  ['sabio','atencao','grat'].forEach(k => {
    const el = document.querySelector('[data-review="'+k+'"]');
    if (el) { el.value = data['review_'+k] || ''; autoResize(el); }
  });

  // Score
  const score = data.score || 0;
  document.querySelectorAll('.score-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.score) === score);
  });

  // Amanha fields
  ['intencao','prio1','prio2','prio3','notatema','notas'].forEach(k => {
    const el = document.querySelector('[data-amanha="'+k+'"]');
    if (el) {
      el.value = data['amanha_'+k] || '';
      if (el.tagName === 'TEXTAREA') autoResize(el);
    }
  });

  // Amanha tema pill — show tomorrow's theme
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowDayIdx  = tomorrow.getDay(); // 0=Dom
  const tomorrowWeekItem = WEEK.find(w => ALL_DAYS.indexOf(w.day) === tomorrowDayIdx);
  if (tomorrowWeekItem) {
    const tagEl   = document.getElementById('amanha-tema-tag');
    const studyEl = document.getElementById('amanha-tema-study');
    if (tagEl)   { tagEl.textContent = tomorrowWeekItem.tag; tagEl.style.color = tomorrowWeekItem.color; }
    if (studyEl)   studyEl.textContent = tomorrowWeekItem.study;
  }

  // Auto-open amanha panel if hour >= 20
  const hour = new Date().getHours();
  const amanhaBody    = document.getElementById('amanha-body');
  const amanhaChevron = document.getElementById('amanha-chevron');
  if (hour >= 20 && amanhaBody && !amanhaBody.classList.contains('open')) {
    amanhaBody.classList.add('open');
    if (amanhaChevron) amanhaChevron.classList.add('open');
  }

  // Render periods and blocks
  const container = document.getElementById('periods-container');
  if (!container) return;
  container.innerHTML = '';

  PERIODS.forEach(period => {
    const pBlocks = BLOCKS.filter(b => b.p === period.id);
    const pState  = getPeriodState(period);
    let badgeClass = '';
    let badgeText  = 'A chegar ○';
    if (pState === 'active') { badgeClass = 'active-period'; badgeText = 'Em curso ●'; }
    if (pState === 'done')   { badgeClass = 'done-period';   badgeText = 'Completo ✓'; }

    const section = document.createElement('div');
    section.className = 'period-section';
    section.innerHTML =
      '<div class="period-header">' +
        '<div class="period-divider"></div>' +
        '<span class="period-label">'+period.label+'</span>' +
        '<span class="period-range">'+period.range+'</span>' +
        '<span class="period-badge '+badgeClass+'" data-period="'+period.id+'">'+badgeText+'</span>' +
        '<div class="period-divider"></div>' +
      '</div>' +
      '<div class="blocks-list" id="blocks-'+period.id+'"></div>';
    container.appendChild(section);

    const blocksList = document.getElementById('blocks-'+period.id);
    pBlocks.forEach(b => {
      const bData  = data.blocks[b.id] || {};
      const isDone = !!bData.done;
      const bState = getBlockState(b);
      const isOpen = expandedBlock === b.id;

      let cardClasses = 'block-card';
      if (bState === 'now')    cardClasses += ' now';
      else if (bState === 'past') cardClasses += ' past';
      if (isOpen)  cardClasses += ' open';
      if (isDone)  cardClasses += ' done';

      const card = document.createElement('div');
      card.className = cardClasses;
      card.dataset.id = b.id;
      card.innerHTML =
        '<div class="block-header" data-toggle-block="'+b.id+'">' +
          '<div class="block-checkbox'+(isDone?' checked':'')+'" data-toggle-done="'+b.id+'"></div>' +
          '<div class="block-meta">' +
            '<div class="block-time-row">' +
              '<span class="block-time">'+b.t+'</span>' +
              '<span class="block-dur">'+b.d+'</span>' +
              '<span class="now-badge">● Agora</span>' +
            '</div>' +
            '<div class="block-label">'+b.label+'</div>' +
          '</div>' +
          '<span class="block-chevron">›</span>' +
        '</div>' +
        '<div class="block-body">' +
          '<div class="block-body-inner">' +
            '<div class="block-desc">'+b.desc+'</div>' +
            renderBlockFields(b, bData) +
            '<label class="notes-label">Notas livres</label>' +
            '<textarea class="field-input" rows="2" data-block-field="'+b.id+'" data-field-key="notes" placeholder="Notas, observações, ideias soltas...">'+(bData.notes||'')+'</textarea>' +
          '</div>' +
        '</div>';
      blocksList.appendChild(card);
    });
  });

  updateProgress();
  initAutoResize(container);

  // Welcome banner
  const profile = loadProfile();
  const banner  = document.getElementById('welcome-banner');
  if (banner) {
    banner.classList.toggle('hidden', !!(profile.nome || profile.essencia));
  }
}

function renderBlockFields(b, bData) {
  if (!b.fields || b.fields.length === 0) return '';
  return b.fields.map(f => {
    const val = (bData[f.k] || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (f.big) {
      const largeClass = f.large ? ' large' : '';
      const rows = f.large ? 4 : 2;
      return '<div class="field-group">' +
        '<label class="field-label">'+f.l+'</label>' +
        '<textarea class="field-input'+largeClass+'" rows="'+rows+'" data-block-field="'+b.id+'" data-field-key="'+f.k+'" placeholder="'+f.l+'...">'+val+'</textarea>' +
      '</div>';
    } else {
      return '<div class="field-group">' +
        '<label class="field-label">'+f.l+'</label>' +
        '<input class="field-input" type="text" data-block-field="'+b.id+'" data-field-key="'+f.k+'" placeholder="'+f.l+'..." value="'+val+'" />' +
      '</div>';
    }
  }).join('');
}

// ===== RENDER SEMANA VIEW =====
function renderSemana() {
  const scroll = document.getElementById('semana-scroll');
  if (!scroll) return;
  scroll.innerHTML = '';

  const todayDayIdx = new Date().getDay();
  const now = new Date();

  WEEK.forEach((w, i) => {
    const dayIdx = ALL_DAYS.indexOf(w.day);
    const diff   = dayIdx - todayDayIdx;
    const cardDate = new Date(now);
    cardDate.setDate(now.getDate() + diff);
    const dateNum = cardDate.getDate();
    const isToday = dayIdx === todayDayIdx;

    const card = document.createElement('div');
    card.className = 'week-card'+(isToday?' today-card':'')+(selectedWeekIdx===i?' selected-card':'');
    card.dataset.weekIdx = i;
    card.innerHTML =
      '<div class="wc-day" style="color:'+w.color+'">'+w.day+'</div>' +
      '<div class="wc-num">'+dateNum+'</div>' +
      '<span class="wc-tag" style="background:'+w.color+'22;color:'+w.color+';border:1px solid '+w.color+'44">'+w.tag+'</span>';
    scroll.appendChild(card);
  });

  if (selectedWeekIdx === null) {
    selectedWeekIdx = WEEK.findIndex(w => ALL_DAYS.indexOf(w.day) === todayDayIdx);
    if (selectedWeekIdx < 0) selectedWeekIdx = 0;
  }
  renderWeekDetail(selectedWeekIdx);
}

function renderWeekDetail(idx) {
  const detail = document.getElementById('week-detail');
  if (!detail) return;
  const w = WEEK[idx];
  detail.classList.add('visible');
  detail.innerHTML =
    '<div class="wd-full-day" style="color:'+w.color+'">'+w.full+'</div>' +
    '<div class="wd-tag" style="color:'+w.color+'">'+w.tag+'</div>' +
    '<div class="wd-section-label">Estudo do dia</div>' +
    '<div class="wd-text">'+w.study+'</div>' +
    '<div class="wd-section-label">Conteúdo / Foco</div>' +
    '<div class="wd-text">'+w.content+'</div>';

  // Update selected card visuals
  document.querySelectorAll('.week-card').forEach((c, i) => {
    c.classList.toggle('selected-card', i === idx);
  });
}

// ===== RENDER ARQUIVO VIEW =====
function renderArquivo() {
  const listWrap = document.getElementById('arquivo-list-wrap');
  const detail   = document.getElementById('arquivo-detail');
  if (!listWrap || !detail) return;
  listWrap.style.display = '';
  detail.classList.remove('visible');
  detail.innerHTML = '';
  detail.style.padding = '';

  const j     = loadJournal();
  const today = todayKey();
  const dates = Object.keys(j).filter(k => k !== today).sort().reverse();

  if (dates.length === 0) {
    listWrap.innerHTML = '<div class="empty-state">Sem dias arquivados ainda.<br/>Os dias anteriores aparecem aqui automaticamente.</div>';
    return;
  }

  const countable = BLOCKS.filter(b => b.d !== '—');
  const list = document.createElement('div');
  list.className = 'arquivo-list';

  dates.forEach(dateKey => {
    const d         = j[dateKey] || {blocks:{}};
    const doneCount = countable.filter(b => d.blocks && d.blocks[b.id] && d.blocks[b.id].done).length;
    const score     = d.score || 0;
    const snippet   = (d.review_sabio || '').substring(0,60)+(d.review_sabio && d.review_sabio.length>60?'…':'');

    const row = document.createElement('div');
    row.className = 'arquivo-row';
    row.dataset.arqDate = dateKey;

    const dots = Array.from({length:5},(_,i)=>'<div class="arq-dot'+(i<score?' filled':'')+'"></div>').join('');
    row.innerHTML =
      '<span class="arq-date">'+formatDateShort(dateKey)+'</span>' +
      '<span class="arq-snippet">'+(snippet||'—')+'</span>' +
      '<div class="arq-meta">' +
        '<span class="arq-count">'+doneCount+'/'+countable.length+'</span>' +
        '<div class="arq-score-dots">'+dots+'</div>' +
      '</div>';
    list.appendChild(row);
  });

  listWrap.innerHTML = '';
  listWrap.appendChild(list);
}

function renderArquivoDetail(dateKey) {
  const listWrap = document.getElementById('arquivo-list-wrap');
  const detail   = document.getElementById('arquivo-detail');
  if (!listWrap || !detail) return;

  listWrap.style.display = 'none';
  detail.innerHTML = '';
  detail.classList.add('visible');
  detail.style.padding = '0 0 16px';

  const d = getDateData(dateKey);

  // Back button
  const back = document.createElement('button');
  back.className = 'back-btn';
  back.innerHTML = '‹ Voltar ao Arquivo';
  back.addEventListener('click', () => {
    listWrap.style.display = '';
    detail.classList.remove('visible');
    detail.innerHTML = '';
    detail.style.padding = '';
  });
  detail.appendChild(back);

  // Date heading
  const dateH = document.createElement('div');
  dateH.className = 'arq-detail-date';
  dateH.textContent = formatDatePT(dateKey);
  detail.appendChild(dateH);

  // Blocks card
  const blocksCard = document.createElement('div');
  blocksCard.className = 'arq-blocks-card';
  BLOCKS.filter(b=>b.d!=='—').forEach(b => {
    const bData  = (d.blocks && d.blocks[b.id]) || {};
    const isDone = !!bData.done;
    const row    = document.createElement('div');
    row.className = 'arq-block-row';
    row.innerHTML =
      '<span class="arq-block-time">'+b.t+'</span>' +
      '<span class="arq-block-check">'+(isDone?'✓':'·')+'</span>' +
      '<span class="arq-block-name'+(isDone?' done-arq':'')+'">'+b.label+'</span>';
    blocksCard.appendChild(row);
  });
  detail.appendChild(blocksCard);

  // Review sections
  const reviews = [
    {k:'review_sabio',   l:'O que o Sábio aprendeu'},
    {k:'review_atencao', l:'O que merecia mais atenção'},
    {k:'review_grat',    l:'Gratidão'},
  ].filter(s => d[s.k]);

  if (reviews.length > 0 || d.score) {
    const revCard = document.createElement('div');
    revCard.className = 'arq-review-card';
    reviews.forEach((s, si) => {
      const wrap = document.createElement('div');
      if (si > 0) wrap.style.marginTop = '12px';
      wrap.innerHTML =
        '<div class="arq-review-label">'+s.l+'</div>' +
        '<div class="arq-review-text">'+d[s.k]+'</div>';
      revCard.appendChild(wrap);
    });
    if (d.score) {
      const scoreWrap = document.createElement('div');
      scoreWrap.style.marginTop = reviews.length > 0 ? '12px' : '0';
      scoreWrap.innerHTML =
        '<div class="arq-review-label">Nota do dia</div>' +
        '<div class="arq-review-text" style="font-family:JetBrains Mono,monospace;font-size:18px;color:var(--accent)">'+d.score+'/5</div>';
      revCard.appendChild(scoreWrap);
    }
    detail.appendChild(revCard);
  }
}

// ===== NAVIGATION =====
function navigate(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById(view+'-view');
  if (target) target.classList.add('active');
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === view);
  });
  if (view === 'dia') {
    expandedBlock = null;
    autoExpanded  = false;
    renderDia();
  } else if (view === 'semana') {
    renderSemana();
  } else if (view === 'arquivo') {
    renderArquivo();
  } else if (view === 'perfil') {
    renderPerfil();
  }
}

// ===== EVENT DELEGATION =====
document.addEventListener('click', e => {
  // Nav items
  const navEl = e.target.closest('[data-nav]');
  if (navEl && navEl.dataset.nav) {
    navigate(navEl.dataset.nav);
    return;
  }
  // Block checkbox (done toggle) — must be before block header toggle
  const doneEl = e.target.closest('[data-toggle-done]');
  if (doneEl) {
    e.stopPropagation();
    const id   = doneEl.dataset.toggleDone;
    const data = getTodayData();
    if (!data.blocks[id]) data.blocks[id] = {};
    data.blocks[id].done = !data.blocks[id].done;
    setTodayData(data);
    const card = document.querySelector('.block-card[data-id="'+id+'"]');
    if (card) {
      card.classList.toggle('done', data.blocks[id].done);
      doneEl.classList.toggle('checked', data.blocks[id].done);
      // Pulse animation
      doneEl.classList.remove('pulse');
      void doneEl.offsetWidth; // reflow
      doneEl.classList.add('pulse');
      setTimeout(() => doneEl.classList.remove('pulse'), 220);
    }
    updateProgress();
    return;
  }
  // Block header (expand/collapse accordion)
  const blockHeader = e.target.closest('[data-toggle-block]');
  if (blockHeader && !e.target.closest('[data-toggle-done]')) {
    const id    = blockHeader.dataset.toggleBlock;
    const card  = document.querySelector('.block-card[data-id="'+id+'"]');
    if (!card) return;
    const isOpen = card.classList.contains('open');
    // Close all
    document.querySelectorAll('.block-card.open').forEach(c => c.classList.remove('open'));
    if (!isOpen) {
      card.classList.add('open');
      expandedBlock = id;
    } else {
      expandedBlock = null;
    }
    return;
  }
  // Amanha toggle button
  if (e.target.closest('#amanha-toggle-btn')) {
    const body    = document.getElementById('amanha-body');
    const chevron = document.getElementById('amanha-chevron');
    if (body)    body.classList.toggle('open');
    if (chevron) chevron.classList.toggle('open');
    return;
  }
  // Score buttons
  const scoreBtn = e.target.closest('.score-btn');
  if (scoreBtn) {
    const score = Number(scoreBtn.dataset.score);
    const data  = getTodayData();
    data.score  = score;
    setTodayData(data);
    document.querySelectorAll('.score-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.score) === score);
    });
    return;
  }
  // Export button
  if (e.target.closest('#export-btn')) {
    exportDay();
    return;
  }
  // Save profile button
  if (e.target.closest('#save-perfil-btn')) {
    savePerfilData();
    return;
  }
  // Perfil section toggle
  const perfilToggle = e.target.closest('[data-perfil-toggle]');
  if (perfilToggle) {
    const wrap    = perfilToggle.closest('.perfil-section');
    const body    = wrap.querySelector('.perfil-body');
    const chevron = wrap.querySelector('.perfil-chevron');
    if (body)    body.classList.toggle('open');
    if (chevron) chevron.classList.toggle('open');
    return;
  }
  // Week card click
  const weekCard = e.target.closest('.week-card');
  if (weekCard) {
    const idx = Number(weekCard.dataset.weekIdx);
    selectedWeekIdx = idx;
    renderWeekDetail(idx);
    return;
  }
  // Arquivo row click
  const arqRow = e.target.closest('.arquivo-row');
  if (arqRow) {
    renderArquivoDetail(arqRow.dataset.arqDate);
    return;
  }
});

// ===== INPUT EVENT DELEGATION =====
document.addEventListener('input', e => {
  const t = e.target;
  // Priority inputs (today)
  if (t.dataset.prio) {
    const data = getTodayData();
    data['prio'+t.dataset.prio] = t.value;
    setTodayData(data);
    return;
  }
  // Review fields
  if (t.dataset.review) {
    const data = getTodayData();
    data['review_'+t.dataset.review] = t.value;
    setTodayData(data);
    return;
  }
  // Amanha fields
  if (t.dataset.amanha) {
    const data = getTodayData();
    data['amanha_'+t.dataset.amanha] = t.value;
    setTodayData(data);
    return;
  }
  // Block fields
  if (t.dataset.blockField && t.dataset.fieldKey) {
    const blockId  = t.dataset.blockField;
    const fieldKey = t.dataset.fieldKey;
    const data     = getTodayData();
    if (!data.blocks[blockId]) data.blocks[blockId] = {};
    data.blocks[blockId][fieldKey] = t.value;
    setTodayData(data);
    return;
  }
  // Profile fields — live save
  if (t.dataset.profileField) {
    return; // saved on button click
  }
  // Auto-resize textareas
  if (t.tagName === 'TEXTAREA') autoResize(t);
});

// ===== THEME =====
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.dataset.theme = saved;
  updateThemeIcon(saved);
}
function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (!icon) return;
  if (theme === 'dark') {
    icon.innerHTML =
      '<circle cx="12" cy="12" r="5"/>' +
      '<line x1="12" y1="1" x2="12" y2="3"/>' +
      '<line x1="12" y1="21" x2="12" y2="23"/>' +
      '<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>' +
      '<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>' +
      '<line x1="1" y1="12" x2="3" y2="12"/>' +
      '<line x1="21" y1="12" x2="23" y2="12"/>' +
      '<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>' +
      '<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}
const themeToggleBtn = document.getElementById('theme-toggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => {
    const cur  = document.documentElement.dataset.theme || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem(THEME_KEY, next);
    updateThemeIcon(next);
  });
}

// ===== EXPORT DAY =====
function exportDay() {
  const data = getTodayData();
  const key  = todayKey();
  const countable = BLOCKS.filter(b => b.d !== '—');
  const doneCount = countable.filter(b => data.blocks[b.id] && data.blocks[b.id].done).length;

  let txt = 'HABITUS OS — ADERRY\n';
  txt += formatDatePT(key)+'\n';
  txt += '='.repeat(44)+'\n\n';

  if (data.prio1 || data.prio2 || data.prio3) {
    txt += 'PRIORIDADES DO DIA\n';
    if (data.prio1) txt += '1. '+data.prio1+'\n';
    if (data.prio2) txt += '2. '+data.prio2+'\n';
    if (data.prio3) txt += '3. '+data.prio3+'\n';
    txt += '\n';
  }

  txt += 'BLOCOS ('+doneCount+'/'+countable.length+' concluídos)\n\n';
  BLOCKS.forEach(b => {
    if (b.d === '—') return;
    const bData  = (data.blocks && data.blocks[b.id]) || {};
    const status = bData.done ? '✓' : '○';
    txt += status+' '+b.t+' – '+b.label+'\n';
    if (b.fields) {
      b.fields.forEach(f => {
        if (bData[f.k]) txt += '  '+f.l+': '+bData[f.k]+'\n';
      });
    }
    if (bData.notes) txt += '  Notas: '+bData.notes+'\n';
  });

  if (data.review_sabio || data.review_atencao || data.review_grat) {
    txt += '\nREVISÃO DO DIA\n';
    if (data.review_sabio)   txt += 'Sábio aprendeu: '+data.review_sabio+'\n';
    if (data.review_atencao) txt += 'Merecia mais atenção: '+data.review_atencao+'\n';
    if (data.review_grat)    txt += 'Gratidão: '+data.review_grat+'\n';
    if (data.score)          txt += 'Nota do dia: '+data.score+'/5\n';
  }

  if (data.amanha_intencao || data.amanha_prio1) {
    txt += '\nAMANHÃ\n';
    if (data.amanha_intencao) txt += 'Intenção: '+data.amanha_intencao+'\n';
    if (data.amanha_prio1)    txt += '1. '+data.amanha_prio1+'\n';
    if (data.amanha_prio2)    txt += '2. '+data.amanha_prio2+'\n';
    if (data.amanha_prio3)    txt += '3. '+data.amanha_prio3+'\n';
  }

  const copyToClipboard = (text) => {
    const btn = document.getElementById('export-btn');
    const showCopied = () => {
      if (btn) { btn.textContent = '✓ Copiado!'; btn.classList.add('copied'); }
      setTimeout(() => {
        if (btn) { btn.textContent = 'Exportar dia → copiar'; btn.classList.remove('copied'); }
      }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
    } else {
      fallbackCopy(text, showCopied);
    }
  };
  const fallbackCopy = (text, cb) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch(e) {}
    document.body.removeChild(ta);
  };
  copyToClipboard(txt);
}

// ===== SAVE PROFILE =====
function savePerfilData() {
  const profile = {};
  document.querySelectorAll('[data-profile-field]').forEach(el => {
    profile[el.dataset.profileField] = el.value;
  });
  saveProfile(profile);

  const btn = document.getElementById('save-perfil-btn');
  if (btn) {
    btn.textContent = '✓ Guardado';
    btn.classList.add('saved');
    setTimeout(() => {
      btn.textContent = 'Guardar Perfil';
      btn.classList.remove('saved');
    }, 2000);
  }
  // Hide welcome banner if we now have profile data
  if (currentView === 'dia') {
    const banner = document.getElementById('welcome-banner');
    if (banner && (profile.nome || profile.essencia)) {
      banner.classList.add('hidden');
    }
  }
}

// ===== INITIALISATION =====
function init() {
  initTheme();
  renderDia();
  setInterval(updateClock, 1000);
  updateClock();

  // First visit: if no profile data, show welcome and navigate to perfil
  const profile = loadProfile();
  if (!profile.nome && !profile.essencia) {
    const banner = document.getElementById('welcome-banner');
    if (banner) banner.classList.remove('hidden');
    setTimeout(() => navigate('perfil'), 700);
  }
}

init();
</script>
