<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habitus OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; -webkit-font-smoothing:antialiased; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { border-radius:4px; }
    * { scrollbar-width:thin; }
    @keyframes pulse  { 0%,100%{opacity:.7} 50%{opacity:1} }
    @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideup{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .live     { animation:pulse   2.5s ease-in-out infinite; }
    .fadein   { animation:fadein  0.22s ease; }
    .slideup  { animation:slideup 0.28s ease; }
    .row      { transition:background 0.15s; cursor:pointer; }
    .tab      { transition:all 0.2s; cursor:pointer; border:none; outline:none; background:none; }
    .wcard    { transition:transform 0.18s, box-shadow 0.18s; }
    .wcard:hover { transform:translateY(-2px); }
    .ibtn     { transition:all 0.18s; cursor:pointer; border:none; }
    .ibtn:hover { opacity:.75; transform:scale(1.06); }
    .task-row { transition:background 0.15s, opacity 0.2s; }
    .lesson-row { transition:background 0.15s; }
    textarea  { resize:vertical; }
  </style>
</head>

/* ─────────────────────────────────────

const weekSystem = [

/* ─────────────────────────────────────
   STORAGE HELPERS
───────────────────────────────────── */
const STORE_KEY = "habitus-journal";

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; }
}
function saveJournal(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}

function dateKey(d) {
  return d.toISOString().slice(0, 10); // "YYYY-MM-DD"
}

function getDay(journal, key) {
  return journal[key] || { tasks: [], lessons: [], notes: "" };
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function fmtTime(d) {
  return d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
}

/* ─────────────────────────────────────

───────────────────────────────────── */

const MoonIcon = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
const PrevIcon = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>;

const PlusIcon = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;

/* ─────────────────────────────────────
   SECTION COMPONENTS
───────────────────────────────────── */
function SectionLabel({ icon: Icon, label, color, C }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px" }}>
      <div style={{
        width:"26px", height:"26px", borderRadius:"7px",
        background:`${color}18`, border:`1px solid ${color}30`,
        display:"flex", alignItems:"center", justifyContent:"center", color,
      }}><Icon /></div>
      <span style={{
        fontFamily:"'JetBrains Mono', monospace", fontSize:"9px",
        letterSpacing:"0.18em", textTransform:"uppercase", color, fontWeight:600,
      }}>{label}</span>
    </div>
  );
}

/* TASKS */
function TasksSection({ C, tasks, onAdd, onToggle, onDelete }) {
  const [input, setInput] = useState("");
  const ref = useRef();

  const submit = () => {
    const t = input.trim();
    if (!t) return;
    onAdd(t);
    setInput("");
    ref.current?.focus();
  };

  const done  = tasks.filter(t => t.done).length;
  const total = tasks.length;

  return (
    <div style={{ marginBottom:"28px" }}>
      <SectionLabel icon={CheckIcon} label="Tarefas do Dia" color={C.primary} C={C} />

      {/* Progress */}
      {total > 0 && (
        <div style={{ marginBottom:"12px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"5px" }}>
            <span style={{ fontFamily:"'JetBrains Mono', monospace", fontSize:"9px", color:C.t4 }}>
              {done}/{total} concluídas
            </span>
            <span style={{ fontFamily:"'JetBrains Mono', monospace", fontSize:"9px", color:done===total ? C.green : C.t4 }}>
              {Math.round((done/total)*100)}%
            </span>
          </div>
          <div style={{ height:"3px", background:C.border, borderRadius:"2px" }}>
            <div style={{
              height:"100%", borderRadius:"2px",
              width:`${(done/total)*100}%`,
              background:`linear-gradient(90deg, ${C.primary}, ${C.green})`,
              transition:"width 0.3s ease",
            }}/>
          </div>
        </div>
      )}

      {/* Input */}
      <div style={{ display:"flex", gap:"8px", marginBottom:"12px" }}>
        <input ref={ref} value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key==="Enter" && submit()}
          placeholder="Adicionar tarefa..."
          style={{
            flex:1, background:C.inputBg, border:`1px solid ${C.border}`,
            borderRadius:"9px", padding:"9px 14px",
            fontFamily:"'Syne', sans-serif", fontSize:"13px", color:C.t1,
            outline:"none",
          }}
        />
        <button className="ibtn" onClick={submit} style={{
          width:"38px", height:"38px", borderRadius:"9px",
          background:`linear-gradient(135deg, ${C.primary}, ${C.pDark})`,
          color:"#fff", display:"flex", alignItems:"center", justifyContent:"center",
          boxShadow:`0 3px 12px ${C.primary}40`,
        }}><PlusIcon /></button>
      </div>

      {/* List */}
      {tasks.length === 0 ? (
        <div style={{
          textAlign:"center", padding:"22px 0",
          fontFamily:"'JetBrains Mono', monospace", fontSize:"10px", color:C.t4,
        }}>Nenhuma tarefa ainda</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:"5px" }}>
          {tasks.map(task => (
            <div key={task.id} className="task-row" style={{
              display:"flex", alignItems:"center", gap:"10px",
              padding:"9px 12px", borderRadius:"9px",
              background: task.done ? C.greenBg : C.card,
              border:`1px solid ${task.done ? C.green+"28" : C.border}`,
              opacity: task.done ? 0.7 : 1,
            }}>
              {/* Checkbox */}
              <button className="ibtn" onClick={() => onToggle(task.id)} style={{
                width:"20px", height:"20px", borderRadius:"6px", flexShrink:0,
                background: task.done ? C.green : "transparent",
                border:`2px solid ${task.done ? C.green : C.t4}`,
                display:"flex", alignItems:"center", justifyContent:"center",
                color:"#fff",
              }}>
                {task.done && <CheckIcon />}
              </button>

              {/* Text */}
              <span style={{
                flex:1, fontFamily:"'Syne', sans-serif", fontSize:"13px",
                color: task.done ? C.t3 : C.t2,
                textDecoration: task.done ? "line-through" : "none",
                lineHeight:1.3,
              }}>{task.text}</span>

              {/* Time */}
              <span style={{
                fontFamily:"'JetBrains Mono', monospace", fontSize:"9px",
                color:C.t4, flexShrink:0,
              }}>{task.time}</span>

              {/* Delete */}
              <button className="ibtn" onClick={() => onDelete(task.id)} style={{
                width:"22px", height:"22px", borderRadius:"6px",
                background:"transparent", border:"none",
                color:C.t4, display:"flex", alignItems:"center", justifyContent:"center",
              }}><TrashIcon /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* LESSONS */
function LessonsSection({ C, lessons, onAdd, onDelete }) {
  const [text,    setText]    = useState("");
  const [subject, setSubject] = useState("");
  const ref = useRef();

  const submit = () => {
    const t = text.trim();
    if (!t) return;
    onAdd(t, subject.trim());
    setText(""); setSubject("");
    ref.current?.focus();
  };

  return (
    <div style={{ marginBottom:"28px" }}>
      <SectionLabel icon={BookIcon} label="Aulas & Aprendizados" color={C.orange} C={C} />

      {/* Input */}
      <div style={{ display:"flex", flexDirection:"column", gap:"6px", marginBottom:"12px" }}>
        <div style={{ display:"flex", gap:"8px" }}>
          <input
            placeholder="Assunto / Fonte (opcional)"
            value={subject} onChange={e => setSubject(e.target.value)}
            style={{
              width:"160px", flexShrink:0,
              background:C.inputBg, border:`1px solid ${C.border}`,
              borderRadius:"9px", padding:"9px 12px",
              fontFamily:"'JetBrains Mono', monospace", fontSize:"10px", color:C.t2,
              outline:"none",
            }}
          />
          <input ref={ref} value={text} onChange={e => setText(e.target.value)}
            onKeyDown={e => e.key==="Enter" && submit()}
            placeholder="O que aprendi hoje..."
            style={{
              flex:1, background:C.inputBg, border:`1px solid ${C.border}`,
              borderRadius:"9px", padding:"9px 14px",
              fontFamily:"'Syne', sans-serif", fontSize:"13px", color:C.t1,
              outline:"none",
            }}
          />
          <button className="ibtn" onClick={submit} style={{
            width:"38px", height:"38px", borderRadius:"9px",
            background:`linear-gradient(135deg, ${C.orange}, ${C.orange}BB)`,
            color:"#fff", display:"flex", alignItems:"center", justifyContent:"center",
            boxShadow:`0 3px 12px ${C.orange}40`, flexShrink:0,
          }}><PlusIcon /></button>
        </div>
      </div>

      {/* List */}
      {lessons.length === 0 ? (
        <div style={{
          textAlign:"center", padding:"22px 0",
          fontFamily:"'JetBrains Mono', monospace", fontSize:"10px", color:C.t4,
        }}>Nenhum aprendizado registado ainda</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
          {lessons.map((les, i) => (
            <div key={les.id} className="lesson-row slideup" style={{
              padding:"11px 14px", borderRadius:"10px",
              background:C.orangeBg, border:`1px solid ${C.orange}28`,
              display:"flex", alignItems:"flex-start", gap:"10px",
            }}>
              {/* Index */}
              <div style={{
                width:"20px", height:"20px", borderRadius:"5px",
                background:`${C.orange}22`, flexShrink:0, marginTop:"1px",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontFamily:"'JetBrains Mono', monospace", fontSize:"9px",
                color:C.orange, fontWeight:600,
              }}>{i+1}</div>

              <div style={{ flex:1, minWidth:0 }}>
                {les.subject && (
                  <div style={{
                    fontFamily:"'JetBrains Mono', monospace", fontSize:"9px",
                    color:C.orange, letterSpacing:"0.1em", textTransform:"uppercase",
                    marginBottom:"3px", fontWeight:600,
                  }}>{les.subject}</div>
                )}
                <div style={{
                  fontFamily:"'Syne', sans-serif", fontSize:"13px",
                  color:C.t2, lineHeight:1.5,
                }}>{les.text}</div>
              </div>

              <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:"6px", flexShrink:0 }}>
                <span style={{
                  fontFamily:"'JetBrains Mono', monospace", fontSize:"9px", color:C.t4,
                }}>{les.time}</span>
                <button className="ibtn" onClick={() => onDelete(les.id)} style={{
                  background:"transparent", border:"none",
                  color:C.t4, display:"flex", alignItems:"center", justifyContent:"center",
                  padding:"2px",
                }}><TrashIcon /></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* NOTES */
function NotesSection({ C, notes, onChange }) {
  return (
    <div style={{ marginBottom:"28px" }}>
      <SectionLabel icon={NoteIcon} label="Anotações do Dia" color={C.pSoft} C={C} />
      <textarea
        value={notes}
        onChange={e => onChange(e.target.value)}
        placeholder={"Reflexões, insights, ideias, o que sentes...\n\nEste espaço é teu — escreve livremente."}
        rows={7}
        style={{
          width:"100%", background:C.inputBg,
          border:`1px solid ${C.border}`,
          borderRadius:"12px", padding:"14px 16px",
          fontFamily:"'Syne', sans-serif", fontSize:"13px",
          color:C.t2, lineHeight:1.7, outline:"none",
          transition:"border-color 0.2s",
        }}
        onFocus={e  => e.target.style.borderColor = C.primary}
        onBlur={e   => e.target.style.borderColor = C.border}
      />
      <div style={{
        marginTop:"6px", textAlign:"right",
        fontFamily:"'JetBrains Mono', monospace", fontSize:"9px", color:C.t4,
      }}>
        {notes.trim() ? `${notes.trim().split(/\s+/).length} palavras · guardado automaticamente` : "começa a escrever — guarda automaticamente"}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────
   MAIN APP
───────────────────────────────────── */
function HabitusOS() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("habitus-theme") || "dark"; } catch { return "dark"; }
  });
  const [tab, setTab]           = useState("dia");
  const [expanded, setExpanded] = useState(null);
  const [now, setNow]           = useState(new Date());
  const [viewDate, setViewDate] = useState(new Date());
  const [journal, setJournal]   = useState(() => loadJournal());

  const C = theme === "dark" ? DARK : LIGHT;

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t);
  }, []);

  const toggleTheme = useCallback(() => {
    setTheme(t => {
      const next = t === "dark" ? "light" : "dark";
      try { localStorage.setItem("habitus-theme", next); } catch {}
      return next;
    });
  }, []);

  /* journal helpers */
  const vKey    = dateKey(viewDate);
  const dayData = useMemo(() => getDay(journal, vKey), [journal, vKey]);

  const updateDay = useCallback((fn) => {
    setJournal(j => {
      const next = { ...j, [vKey]: fn(getDay(j, vKey)) };
      saveJournal(next);
      return next;
    });
  }, [vKey]);

  const addTask   = t  => updateDay(d => ({...d, tasks:   [...d.tasks,   {id:uid(),text:t, done:false, time:fmtTime(now)}]}));
  const togTask   = id => updateDay(d => ({...d, tasks:   d.tasks.map(t => t.id===id ? {...t,done:!t.done} : t)}));
  const delTask   = id => updateDay(d => ({...d, tasks:   d.tasks.filter(t => t.id!==id)}));
  const addLesson = (text, subject) => updateDay(d => ({...d, lessons: [...d.lessons, {id:uid(),text,subject,time:fmtTime(now)}]}));
  const delLesson = id => updateDay(d => ({...d, lessons: d.lessons.filter(l => l.id!==id)}));
  const setNotes  = v  => updateDay(d => ({...d, notes:v}));

  /* date navigation */
  const shiftDate = delta => setViewDate(d => {
    const n = new Date(d); n.setDate(n.getDate() + delta); return n;
  });
  const isToday = dateKey(viewDate) === dateKey(now);

  /* today info */
  const todayShort = allDays[now.getDay()];
  const viewShort  = allDays[viewDate.getDay()];
  const viewWS     = weekSystem.find(w => w.day === viewShort) || weekSystem[0];
  const todayWS    = weekSystem.find(w => w.day === todayShort) || weekSystem[0];
  const dayColor   = theme==="dark" ? todayWS.colorD : todayWS.colorL;
  const timeStr    = fmtTime(now);
  const dayFrac    = (now.getHours()*60 + now.getMinutes()) / (24*60);

  /* current block */
  const hhmm = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
  const nowMin = now.getHours()*60+now.getMinutes();
  let curSec=null, curBlk=null;
  schedule.forEach((sec,si) => {
    sec.blocks.forEach((b,bi) => {
      const st = hhmm(b.time);
      const en = sec.blocks[bi+1] ? hhmm(sec.blocks[bi+1].time)
               : (schedule[si+1] ? hhmm(schedule[si+1].blocks[0].time) : 24*60);
      if (nowMin>=st && nowMin<en) { curSec=si; curBlk=bi; }
    });
  });

  /* stats for diary header */
  const tasksDone  = dayData.tasks.filter(t=>t.done).length;
  const tasksTotal = dayData.tasks.length;
  const lessonsN   = dayData.lessons.length;
  const hasNotes   = dayData.notes.trim().length > 0;

  return (
    <div style={{ minHeight:"100vh", background:C.bg, color:C.t1,
                  fontFamily:"'Syne', system-ui, sans-serif" }}>
      <style>{`
        ::-webkit-scrollbar-thumb { background:${C.scroll}; }
        * { scrollbar-color:${C.scroll} transparent; }
        .row:hover { background:${C.rowHov} !important; }
        .wcard:hover { box-shadow:0 10px 36px ${C.shadow}; }
        input::placeholder, textarea::placeholder { color:${C.t4}; opacity:1; }
        input, textarea { color-scheme:${theme}; }
      `}</style>

      {/* ── TOPBAR ── */}
      <div style={{
        padding:"0 22px", borderBottom:`1px solid ${C.border}`,
        background:C.glass, backdropFilter:"blur(24px)",
        position:"sticky", top:0, zIndex:20,
      }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", height:"54px" }}>

          {/* Logo */}
          <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
            <div style={{
              width:"28px", height:"28px", borderRadius:"8px",
              background:`linear-gradient(135deg,${C.primary},${C.pDark})`,
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:"13px", color:"#fff", boxShadow:`0 3px 12px ${C.primary}45`,
            }}>◈</div>
            <span style={{ fontFamily:"'Syne',sans-serif", fontSize:"15px", fontWeight:700, color:C.t1 }}>Habitus OS</span>
          </div>

          {/* Right */}
          <div style={{ display:"flex", alignItems:"center", gap:"14px" }}>
            <div style={{ display:"flex", gap:"3px" }}>
              {weekSystem.map(w => {
                const wc = theme==="dark" ? w.colorD : w.colorL;
                const isT = w.day === todayShort;
                return (
                  <div key={w.day} title={w.full} style={{
                    width:"26px", height:"26px", borderRadius:"7px",
                    background: isT ? wc : C.card, border:`1px solid ${isT ? wc : C.border}`,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontFamily:"'JetBrains Mono',monospace", fontSize:"8px",
                    fontWeight:isT?700:400, color:isT?"#fff":C.t4,
                  }}>{w.day.charAt(0)}</div>
                );
              })}
            </div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:C.t2 }}>{timeStr}</div>
            <button className="ibtn" onClick={toggleTheme} style={{
              width:"32px", height:"32px", borderRadius:"9px",
              border:`1px solid ${C.border}`, background:C.card, color:C.t2,
              display:"flex", alignItems:"center", justifyContent:"center",
            }}>
              {theme==="dark" ? <SunIcon /> : <MoonIcon />}
            </button>
          </div>
        </div>

        {/* Progress */}
        <div style={{ height:"2px", background:C.border }}>
          <div style={{
            height:"100%", width:`${dayFrac*100}%`,
            background:`linear-gradient(90deg,${C.primary},${dayColor})`,
            transition:"width 60s linear",
          }}/>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex" }}>
          {[["dia","Rotina"],["diario","Diário"],["semana","Semana"]].map(([key,label]) => (
            <button key={key} className="tab" onClick={() => setTab(key)} style={{
              padding:"10px 16px",
              fontFamily:"'JetBrains Mono',monospace", fontSize:"10px",
              letterSpacing:"0.12em", textTransform:"uppercase",
              color: tab===key ? C.primary : C.t3,
              borderBottom: tab===key ? `2px solid ${C.primary}` : "2px solid transparent",
              marginBottom:"-1px",
            }}>{label}</button>
          ))}
        </div>
      </div>

      {/* ── MAIN ── */}
      <div style={{ padding:"22px 22px 56px", maxWidth:"860px", margin:"0 auto" }}>

        {/* Today banner (shared) */}
        <div style={{
          background: theme==="dark"
            ? `linear-gradient(135deg,${dayColor}12,${dayColor}06)`
            : `linear-gradient(135deg,${dayColor}0D,${dayColor}04)`,
          border:`1px solid ${dayColor}28`,
          borderRadius:"14px", padding:"15px 20px", marginBottom:"22px",
        }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr auto", gap:"14px", alignItems:"center" }}>
            <div>
              <div style={{ display:"flex", alignItems:"center", gap:"9px", marginBottom:"7px" }}>
                <span style={{
                  fontFamily:"'JetBrains Mono',monospace", fontSize:"8px",
                  letterSpacing:"0.15em", textTransform:"uppercase",
                  color:dayColor, background:`${dayColor}1E`,
                  padding:"3px 9px", borderRadius:"5px", fontWeight:600,
                }}>{todayWS.tag}</span>
                <span className="live" style={{ width:"5px", height:"5px", borderRadius:"50%", background:dayColor, display:"inline-block" }}/>
                <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t3, letterSpacing:"0.08em" }}>
                  HOJE · {todayWS.full.toUpperCase()}
                </span>
              </div>
              <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"13px", color:C.t1, fontWeight:600, marginBottom:"3px", lineHeight:1.4 }}>
                {todayWS.study.split(",")[0]}
              </div>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"10px", color:C.t3 }}>
                {todayWS.content.split(",")[0]}
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"44px", fontWeight:700, color:`${dayColor}28`, lineHeight:1 }}>
                {now.getDate()}
              </div>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4, marginTop:"2px", letterSpacing:"0.08em" }}>
                {now.toLocaleDateString("pt-PT",{month:"short"}).toUpperCase()} {now.getFullYear()}
              </div>
            </div>
          </div>
        </div>

        {/* ══════════════════════════
            TAB: DIA
        ══════════════════════════ */}
        {tab==="dia" && (
          <div className="fadein">
            <div style={{
              background:C.p10, border:`1px solid ${C.p15}`,
              borderRadius:"10px", padding:"11px 15px", marginBottom:"20px",
              display:"flex", gap:"10px", alignItems:"flex-start",
            }}>
              <span style={{ fontSize:"14px", flexShrink:0 }}>💡</span>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"10px", color:C.t3, lineHeight:1.65 }}>
                <strong style={{ color:C.pSoft }}>Rotina de exemplo</strong> — Rotina real do criador.
                Clica em qualquer bloco para ver detalhes.
                {curSec!==null && <> Bloco actual <strong style={{ color:C.pSoft }}>destacado</strong>.</>}
              </div>
            </div>

            {schedule.map((sec,si) => {
              const sc = theme==="dark" ? sec.colorD : sec.colorL;
              return (
                <div key={si} style={{ marginBottom:"24px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"9px" }}>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", letterSpacing:"0.2em", textTransform:"uppercase", color:sc, fontWeight:600 }}>
                      {sec.icon} {sec.period}
                    </div>
                    <div style={{ flex:1, height:"1px", background:`linear-gradient(90deg,${sc}35,transparent)` }}/>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4 }}>{sec.blocks.length} blocos</div>
                  </div>
                  <div style={{ border:`1px solid ${C.border}`, borderRadius:"13px", overflow:"hidden", background:C.surface, boxShadow:`0 2px 14px ${C.shadow}` }}>
                    {sec.blocks.map((block,bi) => {
                      const key   = `${si}-${bi}`;
                      const open  = expanded===key;
                      const isCur = curSec===si && curBlk===bi;
                      return (
                        <div key={bi} className="row"
                          onClick={() => setExpanded(open ? null : key)}
                          style={{
                            display:"grid", gridTemplateColumns:"70px 86px 1fr 18px",
                            alignItems:"center", gap:"12px", padding:"12px 15px",
                            background: isCur ? `${sc}18` : open ? `${sc}0D` : "transparent",
                            borderBottom: bi<sec.blocks.length-1 ? `1px solid ${C.border}` : "none",
                            borderLeft: isCur ? `3px solid ${sc}` : open ? `3px solid ${sc}80` : "3px solid transparent",
                          }}>
                          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"11px", color:(open||isCur)?sc:C.t3, fontWeight:(open||isCur)?600:400, display:"flex", alignItems:"center", gap:"5px" }}>
                            {isCur && <span className="live" style={{ width:"5px", height:"5px", borderRadius:"50%", background:sc, display:"inline-block", flexShrink:0 }}/>}
                            {block.time}
                          </div>
                          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:sc, background:`${sc}18`, borderRadius:"5px", padding:"3px 8px", textAlign:"center", letterSpacing:"0.04em", whiteSpace:"nowrap" }}>{block.duration}</div>
                          <div>
                            <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"13px", color:(open||isCur)?C.t1:C.t2, fontWeight:(open||isCur)?600:400, lineHeight:1.3 }}>{block.label}</div>
                            {open && <div className="fadein" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"10px", color:C.t3, marginTop:"5px", lineHeight:1.65 }}>{block.detail}</div>}
                          </div>
                          <div style={{ color:open?sc:C.t4, fontSize:"15px", transition:"transform 0.2s,color 0.15s", transform:open?"rotate(90deg)":"none", textAlign:"center", userSelect:"none" }}>›</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ══════════════════════════
            TAB: DIÁRIO
        ══════════════════════════ */}
        {tab==="diario" && (
          <div className="fadein">

            {/* Date navigator */}
            <div style={{
              display:"flex", alignItems:"center", justifyContent:"space-between",
              background:C.surface, border:`1px solid ${C.border}`,
              borderRadius:"12px", padding:"11px 16px", marginBottom:"20px",
              boxShadow:`0 2px 12px ${C.shadow}`,
            }}>
              <button className="ibtn" onClick={() => shiftDate(-1)} style={{
                width:"30px", height:"30px", borderRadius:"8px",
                background:C.card, border:`1px solid ${C.border}`,
                color:C.t3, display:"flex", alignItems:"center", justifyContent:"center",
              }}><PrevIcon /></button>

              <div style={{ textAlign:"center" }}>
                <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"14px", fontWeight:700, color:C.t1 }}>
                  {viewDate.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
                </div>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, marginTop:"2px", letterSpacing:"0.1em" }}>
                  {isToday ? "HOJE" : vKey}
                  {" · "}
                  <span style={{ color:C.green }}>{tasksDone}/{tasksTotal} tarefas</span>
                  {" · "}
                  <span style={{ color:C.orange }}>{lessonsN} aulas</span>
                  {" · "}
                  <span style={{ color:C.pSoft }}>{hasNotes ? "notas ✓" : "sem notas"}</span>
                </div>
              </div>

              <button className="ibtn" onClick={() => shiftDate(1)} style={{
                width:"30px", height:"30px", borderRadius:"8px",
                background:C.card, border:`1px solid ${C.border}`,
                color:C.t3, display:"flex", alignItems:"center", justifyContent:"center",
              }}><NextIcon /></button>
            </div>

            {/* Sections */}
            <TasksSection   C={C} tasks={dayData.tasks}     onAdd={addTask}   onToggle={togTask} onDelete={delTask} />
            <LessonsSection C={C} lessons={dayData.lessons} onAdd={addLesson} onDelete={delLesson} />
            <NotesSection   C={C} notes={dayData.notes}     onChange={setNotes} />

            {/* Export note */}
            <div style={{
              background:C.p10, border:`1px solid ${C.p15}`,
              borderRadius:"10px", padding:"11px 15px",
              display:"flex", gap:"10px", alignItems:"flex-start",
            }}>
              <span style={{ fontSize:"14px", flexShrink:0 }}>💾</span>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"10px", color:C.t3, lineHeight:1.65 }}>
                <strong style={{ color:C.pSoft }}>Guardado localmente</strong> — Todos os dados são guardados no teu browser (localStorage).
                Podes navegar entre dias com as setas. Os dados persistem entre sessões.
              </div>
            </div>
          </div>
        )}

        {/* ══════════════════════════
            TAB: SEMANA
        ══════════════════════════ */}
        {tab==="semana" && (
          <div className="fadein" style={{ display:"flex", flexDirection:"column", gap:"7px" }}>
            <div style={{
              background:C.p10, border:`1px solid ${C.p15}`,
              borderRadius:"10px", padding:"11px 15px", marginBottom:"10px",
              display:"flex", gap:"10px", alignItems:"flex-start",
            }}>
              <span style={{ fontSize:"14px", flexShrink:0 }}>📅</span>
              <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"10px", color:C.t3, lineHeight:1.65 }}>
                <strong style={{ color:C.pSoft }}>Sistema semanal</strong> — Cada dia tem tema de estudo e foco de conteúdo.
                Consistência diária cria profundidade.
              </div>
            </div>
            {weekSystem.map((w,i) => {
              const wc  = theme==="dark" ? w.colorD : w.colorL;
              const isT = w.day === todayShort;
              return (
                <div key={i} className="wcard" style={{
                  background: isT
                    ? (theme==="dark"?`linear-gradient(135deg,${wc}12,${wc}06)`:`linear-gradient(135deg,${wc}0D,${wc}04)`)
                    : C.surface,
                  border:`1px solid ${isT ? wc+"30" : C.border}`,
                  borderRadius:"13px", padding:"14px 18px",
                  display:"grid", gridTemplateColumns:"110px 1fr 1fr",
                  gap:"18px", alignItems:"start",
                  boxShadow:`0 2px 12px ${C.shadow}`,
                }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:"7px", marginBottom:"6px" }}>
                      {isT && <span className="live" style={{ width:"6px", height:"6px", borderRadius:"50%", background:wc, display:"inline-block", flexShrink:0 }}/>}
                      <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"14px", fontWeight:700, color:isT?wc:C.t2 }}>{w.full}</div>
                    </div>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:wc, background:`${wc}18`, borderRadius:"5px", padding:"2px 8px", display:"inline-block", fontWeight:600 }}>{w.tag}</div>
                  </div>
                  <div>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:"5px" }}>Estudo</div>
                    <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"11px", color:C.t3, lineHeight:1.6 }}>{w.study}</div>
                  </div>
                  <div>
                    <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"8px", color:C.t4, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:"5px" }}>Conteúdo</div>
                    <div style={{ fontFamily:"'Syne',sans-serif", fontSize:"11px", color:C.t3, lineHeight:1.6 }}>{w.content}</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{
        borderTop:`1px solid ${C.border}`, padding:"15px 22px",
        display:"flex", justifyContent:"space-between", alignItems:"center",
        background:C.glass, backdropFilter:"blur(12px)",
      }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4, letterSpacing:"0.1em" }}>HABITUS OS · SISTEMA DE ROTINA</div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", color:C.t4 }}>
          {now.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HabitusOS />);
</script>
</body>
</html>
